function ntMark(k){ try { localStorage.setItem("hifz-nt-" + k, String(Date.now())); } catch(e){} }
function ntLast(k){ try { return +(localStorage.getItem("hifz-nt-" + k) || 0); } catch(e){ return 0; } }
function ntTick(){
  if (!ntOn() || !S) return;
  var now = new Date(), hh = now.getHours();

  var at = S.settings.notifyAt;
  if (at && /^\d\d:\d\d$/.test(at)){
    var p = at.split(":"), due = new Date(now); due.setHours(+p[0], +p[1], 0, 0);
    var d = day(TODAY);
    if (now >= due && ntLast("daily") < due.getTime() && !isRestDay(TODAY) && !d.sabaq.done){
      ntShow(L.nt.dailyTitle, fmt(L.nt.dailyBody, n(d.sabaq.pages[0] || S.settings.startPage),
             n(d.sabaq.from || 1), n(d.sabaq.to || LINES_PER_PAGE)));
      ntMark("daily");
    }
  }

  var every = +S.settings.zikrEvery || 0;
  if (every && hh >= 5 && hh < 22){
    if (Date.now() - ntLast("zikr") >= every * 60000){
      var i = Math.floor(Date.now() / (every * 60000)) % ZIKR.length, z = ZIKR[i];
      ntShow(z.ar, z.nm[L.code] || z.nm.en);
      ntMark("zikr");
    }
  }
}
function ntSchedule(){ clearInterval(NT.timer); NT.timer = setInterval(ntTick, 30000); ntTick(); }

/* ---------- recording + phrase loop ----------
   Memorization has to be verified out loud: the cover-and-recite test is
   recorded, kept with the day's page, and played back against the reciter. */
var REC = { mr:null, chunks:[], url:null, key:null };
function recKey(){ return "rec/" + TODAY + "/p" + RD.page; }
async function recStart(){
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    REC.chunks = [];
    REC.mr = new MediaRecorder(stream);
    REC.mr.ondataavailable = function(e){ if (e.data.size) REC.chunks.push(e.data); };
    REC.mr.onstop = async function(){
      stream.getTracks().forEach(function(t){ t.stop(); });
      var blob = new Blob(REC.chunks, { type:"audio/webm" });
      if (REC.url) URL.revokeObjectURL(REC.url);
      REC.url = URL.createObjectURL(blob);
      REC.key = recKey();
      try { var c = await rdCache(); if (c) await c.put(recKey(), new Response(blob)); } catch(e){}
      REC.mr = null;
      renderMushaf();
    };
    REC.mr.start();
    renderMushaf();
  } catch(e){
    var p = document.getElementById("rd-prog");
    if (p) p.textContent = L.rec.denied;
  }
}
function recStop(){ if (REC.mr && REC.mr.state !== "inactive") REC.mr.stop(); }
async function recLoad(){
  if (REC.key === recKey() && REC.url) return REC.url;
  try {
    var c = await rdCache(), hit = c ? await c.match(recKey()) : null;
    if (!hit) return null;
    if (REC.url) URL.revokeObjectURL(REC.url);
    REC.url = URL.createObjectURL(await hit.blob());
    REC.key = recKey();
    return REC.url;
  } catch(e){ return null; }
}
function recCompare(){
  var pg = RD.pages[RD.page], keys = pg ? rdSelKeys(pg) : [];
  if (!keys.length) return;
  rdPlay(keys, 1);
  var wait = setInterval(function(){
    if (!rdAudio){
      clearInterval(wait);
      var a = document.getElementById("rec-mine");
      if (a){ a.currentTime = 0; a.play().catch(function(){}); }
    }
  }, 400);
}
function recBox(){
  var box = document.getElementById("rd-rec");
  if (!box) return;
  var rec = !!(REC.mr && REC.mr.state === "recording");
  var head = '<button class="abtn' + (rec ? "" : " go") + '" data-rec="t">' +
      (rec ? '<span class="recdot"></span> ' + L.rec.stop : L.rec.start) + '</button>';
  var wire = function(){
    qa("#rd-rec [data-rec]").forEach(function(b){
      b.onclick = function(){ b.dataset.rec === "t" ? (REC.mr ? recStop() : recStart()) : recCompare(); };
    });
  };
  box.innerHTML = head + '<span class="lb">' + L.rec.none + '</span>';
  wire();
  recLoad().then(function(url){
    var b2 = document.getElementById("rd-rec");
    if (!url || !b2) return;
    b2.innerHTML = head + '<span class="lb">' + L.rec.mine + '</span>' +
      '<audio id="rec-mine" controls src="' + url + '"></audio>' +
      '<button class="abtn" data-rec="c">' + L.rec.compare + '</button>' +
      '<a class="abtn" href="' + url + '" download="hifz-' + TODAY + '-p' + RD.page + '.webm">' + L.rec.dl + '</a>';
    wire();
  });
}

/* A stubborn phrase inside one ayah: the word weights give its slice of the
   recitation, so it can be looped slowly without cutting any audio files. */
function rdPlayPhrase(pg, vk, i0, i1){
  rdStop();
  var ws = exWordsOf(pg, vk);
  if (!ws.length) return;
  var wt = ws.map(function(w){ return Math.max(1, w.g.length); });
  var tot = wt.reduce(function(a, b){ return a + b; }, 0), s0 = 0, s1 = 0, i;
  for (i = 0; i < i0; i++) s0 += wt[i];
  for (i = 0; i <= i1; i++) s1 += wt[i];
  var f0 = s0 / tot, f1 = Math.min(1, s1 / tot), left = Math.max(1, RD.loops);
  var a = new Audio(AUDIO_BASE + S.settings.reciter + "/" + ayahFile(vk));
  a.playbackRate = Math.min(RD.speed, 0.85);
  rdAudio = a;
  a.onloadedmetadata = function(){ a.currentTime = f0 * a.duration; a.play().catch(function(){}); };
  a.ontimeupdate = function(){
    if (a.duration && a.currentTime >= f1 * a.duration){
      left--;
      if (left <= 0){ rdStop(); return; }
      a.pause();
      setTimeout(function(){ if (rdAudio === a){ a.currentTime = f0 * a.duration; a.play().catch(function(){}); } }, 800);
    }
  };
  a.onplay = rdSyncBtns; a.onpause = rdSyncBtns;
}

/* ---------- retrieval test ----------
   Three formats, all built from the page data already on the device:
   reorder the pieces, fill the gap, choose the continuation. Every wrong
   answer is counted into the day's error log; a poor run marks the page weak. */
var EX = null;
function exShuffle(a){ for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function exWordsOf(pg, vk){
  var out = [];
  for (var ln = 1; ln <= LINES_PER_PAGE; ln++){
    (pg.lines[ln] || []).forEach(function(w){ if (w.vk === vk && !w.end) out.push(w); });
  }
  return out;
}
function exChunks(ws, size){
  var out = [];
  for (var i = 0; i < ws.length; i += size) out.push(ws.slice(i, i + size).map(function(w){ return w.g; }).join(" "));
  return out;
}
function exPool(pg, notVk){
  var out = [];
  for (var ln = 1; ln <= LINES_PER_PAGE; ln++){
    (pg.lines[ln] || []).forEach(function(w){ if (w.vk !== notVk && !w.end) out.push(w.g); });
  }
  return out;
}
function exBuild(mode){
  var pg = RD.pages[RD.page], keys = pg ? rdSelKeys(pg) : [];
  if (!pg || !keys.length) return null;
  var items = [];
  if (mode === "order"){
    keys.forEach(function(vk){
      var ws = exWordsOf(pg, vk);
      if (ws.length < 3) return;
      var ch = exChunks(ws, ws.length > 9 ? 3 : 2);
      if (ch.length < 2) return;
      items.push({ kind:"order", vk:vk, right:ch, pool:exShuffle(ch.slice()) });
    });
  } else if (mode === "cloze"){
    keys.forEach(function(vk){
      var ws = exWordsOf(pg, vk);
      if (ws.length < 4) return;
      var hide = 1 + Math.floor(Math.random() * (ws.length - 2));
      var opts = [ws[hide].g], pool = exShuffle(exPool(pg, vk));
      for (var i = 0; i < pool.length && opts.length < 4; i++) if (opts.indexOf(pool[i]) < 0) opts.push(pool[i]);
      items.push({ kind:"cloze", vk:vk, hide:hide,
        text:ws.map(function(w, i){ return i === hide ? '<span class="gap"></span>' : w.g; }).join(" "),
        opts:exShuffle(opts), ans:ws[hide].g });
    });
  } else {
    keys.forEach(function(vk){
      var ws = exWordsOf(pg, vk);
      if (ws.length < 5) return;
      var cut = Math.max(2, Math.floor(ws.length / 2));
      var ans = ws.slice(cut, cut + 2).map(function(w){ return w.g; }).join(" ");
      var opts = [ans], pool = exShuffle(exPool(pg, vk));
      for (var i = 0; i + 1 < pool.length && opts.length < 4; i += 2){
        var cand = pool[i] + " " + pool[i+1];
        if (opts.indexOf(cand) < 0) opts.push(cand);
      }
      items.push({ kind:"next", vk:vk, text:ws.slice(0, cut).map(function(w){ return w.g; }).join(" "),
        opts:exShuffle(opts), ans:ans });
    });
  }
  if (!items.length) return null;
  return { mode:mode, items:items, i:0, right:0, wrong:0, picked:[], done:false };
}
function exOpen(mode){
  var built = exBuild(mode || "order");
  var box = document.getElementById("exam");
  if (!built){
    box.classList.add("on");
    document.getElementById("exam-in").innerHTML =
      '<h3>' + L.ex.title + '</h3><p class="intro">' + L.ex.need + '</p>' +
      '<div class="exfoot"><button class="abtn" data-ex="close">' + L.ex.close + '</button></div>';
    exWire();
    return;
  }
  EX = built;
  box.classList.add("on");
  exRender();
}
function exRender(msg, cls){
  var E = L.ex, it = EX.items[EX.i], fam = RD.fonts[RD.page] || "";
  var h = '<div class="exhead"><div><div class="kicker">' + E.title + '</div>' +
          '<h3>' + E[EX.mode === "order" ? "order" : EX.mode === "cloze" ? "cloze" : "next"] + '</h3></div>' +
          '<span class="rdprog">' + fmt(E.q, n(EX.i + 1), n(EX.items.length)) + '</span></div>';
  h += '<div class="exmodes">' + ["order","cloze","next"].map(function(m){
        return '<button class="rdtog" data-exmode="' + m + '" aria-pressed="' + (EX.mode === m) + '"><i></i>' + E[m] + '</button>';
      }).join("") + '</div>';
  if (EX.done){
    h += '<p class="intro" style="margin-top:14px">' + E.done + ' · ' + fmt(E.score, n(EX.right), n(EX.wrong)) + '</p>';
    if (EX.wrong > EX.right) h += '<p class="exmsg no">' + E.weakAdd + '</p>';
    h += '<div class="exfoot"><button class="abtn go" data-ex="again">' + E.again + '</button>' +
         '<button class="abtn" data-ex="close">' + E.close + '</button></div>';
  } else if (it.kind === "order"){
    h += '<p class="intro">' + E.orderHint + '</p>' +
         '<div class="exq" style="font-family:\'' + fam + '\'">' +
           (EX.picked.length ? EX.picked.join(" ") : "&nbsp;") + '</div>' +
         '<div class="exchips" style="font-family:\'' + fam + '\'">' +
         it.pool.map(function(c, i){
           return '<button class="exchip' + (EX.picked.indexOf(c) > -1 ? " used" : "") +
                  '" data-exchip="' + i + '">' + c + '</button>';
         }).join("") + '</div>';
  } else {
    h += '<p class="intro">' + (it.kind === "cloze" ? E.clozeHint : E.nextHint) + '</p>' +
         '<div class="exq" style="font-family:\'' + fam + '\'">' +
           (it.kind === "cloze" ? it.text : it.text + ' <span class="gap"></span>') + '</div>' +
         '<div class="exchips" style="font-family:\'' + fam + '\'">' +
         it.opts.map(function(o, i){ return '<button class="exchip" data-exopt="' + i + '">' + o + '</button>'; }).join("") +
         '</div>';
  }
  if (!EX.done) h += '<p class="exmsg ' + (cls || "") + '">' + (msg || "") + '</p>' +
                     '<div class="exfoot"><button class="abtn" data-ex="close">' + E.close + '</button></div>';
  document.getElementById("exam-in").innerHTML = h;
  exWire();
}
function exFinish(){
  EX.done = true;
  var d = day(TODAY);
  d.errors = (d.errors || 0) + EX.wrong;
  revRecord(RD.page, EX.right + EX.wrong ? EX.right / (EX.right + EX.wrong) : 0);
  save(); renderToday(); renderProgress();
  exRender();
}
function exNext(){
  if (EX.i + 1 >= EX.items.length) return exFinish();
  EX.i++; EX.picked = [];
  exRender();
}
function exWire(){
  qa("[data-ex]").forEach(function(b){
    b.onclick = function(){
      if (b.dataset.ex === "close"){ document.getElementById("exam").classList.remove("on"); }
      else exOpen(EX ? EX.mode : "order");
    };
  });
  qa("[data-exmode]").forEach(function(b){ b.onclick = function(){ exOpen(b.dataset.exmode); }; });
  qa("[data-exchip]").forEach(function(b){
    b.onclick = function(){
      var it = EX.items[EX.i], c = it.pool[+b.dataset.exchip];
      if (c === it.right[EX.picked.length]){
        EX.picked.push(c);
        if (EX.picked.length === it.right.length){ EX.right++; rdPlay([it.vk], 1); setTimeout(exNext, 700); }
        else exRender(L.ex.right, "ok");
      } else { EX.wrong++; b.classList.add("bad"); exRender(L.ex.wrong, "no"); }
    };
  });
  qa("[data-exopt]").forEach(function(b){
    b.onclick = function(){
      var it = EX.items[EX.i];
      if (it.opts[+b.dataset.exopt] === it.ans){ EX.right++; b.classList.add("good"); rdPlay([it.vk], 1); setTimeout(exNext, 700); }
      else { EX.wrong++; b.classList.add("bad"); exRender(L.ex.wrong, "no"); }
    };
  });
}

    '<div style="font-size:30px;color:#A4813F">حفظ</div>' +

    '<p style="color:#69707E;font-size:15px">Your saved data is safe — this is a display problem, not a data problem. ' +
    'Try reloading the page. If it keeps happening, send the line below to the developer.</p>' +
    '<pre style="background:#E6E8E2;padding:14px;overflow:auto;font-size:12.5px;margin-top:16px">' +
    esc(err && (err.stack || err.message) || err) + '</pre></div>';
}
