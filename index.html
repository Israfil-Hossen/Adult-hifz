<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>হিফজ · দৈনিক সঙ্গী</title>
<meta name="theme-color" content="#131F35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" href="">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#131F35; --ink-2:#24344F; --ink-3:#3C4C68;
  --paper:#EFF0EC; --paper-2:#E6E8E2; --card:#F6F7F3;
  --verdigris:#2C6A5E; --verd-soft:#DCE7E3;
  --brass:#A4813F; --brass-soft:#EFE6D4;
  --maroon:#7E3540; --maroon-soft:#F0DFE0;
  --muted:#69707E; --rule:#D3D6CF;
  --display:Georgia,serif; --body:system-ui,sans-serif;
  --arabic:"Amiri","Traditional Arabic",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --lh:1.72;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:var(--lh);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:780px;margin:0 auto;padding:0 20px}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- TOP BAR ---------- */
.top{background:var(--ink);color:var(--paper);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .mark{font-family:var(--arabic);font-size:23px;color:var(--brass);line-height:1}
.brand .nm{font-family:var(--display);font-size:19px}
.brand .dt{font-family:var(--mono);font-size:10.5px;color:#7D8798;letter-spacing:.08em;display:block;margin-top:1px}
.streak{text-align:end;flex:none}
.streak .v{font-family:var(--display);font-size:24px;line-height:1;color:var(--brass)}
.streak .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#7D8798;display:block;margin-top:3px}

.topbtns{display:flex;gap:8px;align-items:center;padding-bottom:12px;flex-wrap:wrap}
.sync{
  display:none;align-items:center;gap:7px;padding:5px 11px;
  border:1px solid rgba(164,129,63,.4);font-family:var(--mono);
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#9BA5B5;
}
.sync.show{display:inline-flex}
.sync .dot{width:7px;height:7px;border-radius:50%;background:#69717F;flex:none;transition:background .3s}
.sync.ok{color:#B9C2D2;border-color:rgba(44,106,94,.7)}
.sync.ok .dot{background:#4E9B87}
.sync.busy .dot{background:var(--brass);animation:pulse 1.1s ease-in-out infinite}
.sync.err{color:#D9A3A3;border-color:rgba(158,80,80,.7)}
.sync.err .dot{background:#B85C5C}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.langpick{background:transparent;border:1px solid rgba(164,129,63,.4);color:#B9C2D2;padding:5px 9px;font-size:12px}
.langpick option{background:#1B2942;color:#EFF0EC}

/* ---------- TABS ---------- */
.tabs{background:var(--ink);border-top:1px solid rgba(164,129,63,.2)}
.tabs .wrap{display:flex;width:100%}
.tab{flex:1;padding:13px 4px;font-size:14.5px;color:#8C97A8;border-bottom:2px solid transparent;text-align:center}
.tab[aria-selected="true"]{color:var(--paper);border-bottom-color:var(--brass)}

/* ---------- VIEWS ---------- */
.view{display:none;padding:26px 0 60px}
.view.on{display:block}
.kicker{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--verdigris);margin-bottom:9px}
h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.35;margin-bottom:10px}
h3{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.4}
.intro{color:var(--muted);font-size:15px;max-width:62ch}

/* ---------- PHASE ---------- */
.phase{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--ink);color:var(--paper);padding:16px 20px;margin-bottom:20px;
  border-inline-start:3px solid var(--brass);
}
.phase .a{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--brass)}
.phase .b{font-family:var(--display);font-size:19px;margin-top:2px}
.phase .c{font-size:13.5px;color:#9BA5B5;max-width:36ch}

/* ---------- GATE ---------- */
.gate{border:1px solid var(--rule);background:var(--card);padding:20px;margin-bottom:18px}
.gate.pass{border-color:var(--verdigris);background:var(--verd-soft)}
.gate.fail{border-color:var(--maroon);background:var(--maroon-soft)}
.gate .q{font-family:var(--display);font-size:18px;margin-bottom:14px}
.gate .btns{display:flex;gap:10px;flex-wrap:wrap}
.gbtn{padding:9px 18px;border:1px solid var(--ink-3);font-size:14.5px}
.gbtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gbtn.sel-y{background:var(--verdigris);color:#fff;border-color:var(--verdigris)}
.gbtn.sel-n{background:var(--maroon);color:#fff;border-color:var(--maroon)}
.gate .verdict{margin-top:13px;font-size:14.5px;color:var(--ink-2)}
.gate .verdict b{color:var(--maroon)}

/* ---------- BLOCK CARDS ---------- */
.blk{border:1px solid var(--rule);background:var(--card);margin-bottom:14px}
.blk.done{border-color:var(--verdigris)}
.blk-h{display:flex;align-items:flex-start;gap:14px;padding:17px 18px}
.blk-h .idx{
  font-family:var(--mono);font-size:10px;color:var(--brass);
  border:1px solid var(--brass);width:24px;height:24px;flex:none;
  display:flex;align-items:center;justify-content:center;margin-top:5px;
}
.blk.done .idx{background:var(--verdigris);border-color:var(--verdigris);color:#fff}
.blk-h .txt{flex:1;min-width:0}
.blk-h .ttl{font-family:var(--display);font-size:18px;line-height:1.45}
.blk-h .ttl .ar{font-family:var(--arabic);color:var(--verdigris);margin-inline-end:6px;font-size:17px}
.blk-h .meta{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-top:3px}
.tog{flex:none;width:30px;height:30px;border:1.5px solid var(--ink-3);border-radius:50%;position:relative;margin-top:3px}
.tog[aria-pressed="true"]{background:var(--verdigris);border-color:var(--verdigris)}
.tog[aria-pressed="true"]::after{
  content:"";position:absolute;left:10px;top:6px;width:6px;height:12px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.blk-b{padding:16px 18px 18px;border-top:1px solid var(--rule)}
.blk-b p{font-size:14.5px;color:var(--ink-2)}
.blk-b p + p{margin-top:8px}

/* page grid — Arabic script, always right-aligned */
.pg{border:1px solid rgba(164,129,63,.4);padding:14px 13px;margin:4px 0 16px;background:#fff}
.pgrow{display:flex;align-items:center;gap:10px;direction:rtl}
.pgrow + .pgrow{margin-top:7px}
.pgn{font-family:var(--mono);font-size:9.5px;color:var(--brass);opacity:.7;width:14px;flex:none;direction:ltr}
.pgl{height:3px;background:#B6BDC9;border-radius:2px;transition:background .3s}
.pgb{display:block;width:100%;padding:7px 6px;border-right:2px solid transparent;transition:background .22s,border-color .22s}
.pgb + .pgb{margin-top:3px}
.pgb:hover{background:rgba(44,106,94,.09)}
.pgb[aria-pressed="true"]{background:rgba(44,106,94,.14);border-right-color:var(--verdigris)}
.pgb[aria-pressed="true"] .pgl{background:var(--verdigris)}
.pgb[aria-pressed="true"] .pgn{opacity:1;color:var(--verdigris)}

.steps{list-style:none;counter-reset:s;margin-top:4px}
.steps li{
  counter-increment:s;position:relative;padding-inline-start:28px;
  font-size:14.5px;color:var(--ink-2);margin-bottom:9px;
}
.steps li::before{
  content:counter(s);position:absolute;inset-inline-start:0;top:5px;
  font-family:var(--mono);font-size:9.5px;color:var(--brass);
  border:1px solid rgba(164,129,63,.5);width:17px;height:17px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;line-height:1;
}
.steps li b{color:var(--ink);font-weight:600}

.queue{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 14px}
.qp{font-family:var(--mono);font-size:12px;padding:7px 11px;border:1px solid var(--rule);background:#fff;color:var(--ink-2)}
.qp[aria-pressed="true"]{background:var(--verdigris);border-color:var(--verdigris);color:#fff}
.qp.weak{border-color:var(--maroon);color:var(--maroon)}
.qp.weak[aria-pressed="true"]{background:var(--maroon);border-color:var(--maroon);color:#fff}
.qp .d{display:block;font-size:9px;opacity:.7;margin-top:1px}
.empty{font-size:14px;color:var(--muted);font-style:italic;margin-bottom:12px}

.ctr{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.cbtn{width:34px;height:34px;border:1px solid var(--ink-3);font-size:18px;display:flex;align-items:center;justify-content:center}
.cbtn:hover{background:var(--ink);color:var(--paper)}
.cval{font-family:var(--display);font-size:26px;min-width:44px;text-align:center}
.clbl{font-size:13.5px;color:var(--muted)}
.tbtn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--verdigris);color:var(--verdigris);padding:7px 13px;margin-top:6px}
.tbtn:hover{background:var(--verdigris);color:#fff}

/* ---------- FIELDS ---------- */
.log{border:1px solid var(--rule);background:var(--card);padding:20px 18px;margin-top:22px}
.fld{margin-bottom:16px}
.fld:last-child{margin-bottom:0}
.fld label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{
  width:100%;padding:10px 12px;border:1px solid var(--rule);background:#fff;font-size:15px;border-radius:0;
}
.fld textarea{min-height:74px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

.sum{background:var(--ink);color:var(--paper);padding:20px 18px;margin-top:22px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sum .lab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7D8798}
.sum .big{font-family:var(--display);font-size:30px;color:var(--brass)}
.bar{height:5px;background:rgba(255,255,255,.13);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .5s cubic-bezier(.2,.7,.3,1)}

/* ---------- PROGRESS ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:26px}
.st{background:var(--paper);padding:16px 15px}
.st .v{font-family:var(--display);font-size:27px;line-height:1.2}
.st .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
.mapwrap{margin-bottom:28px}
.maplbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px;flex-wrap:wrap;gap:8px}
.maplbl .t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.mushafmap{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;direction:ltr}
.mc{aspect-ratio:1;background:var(--paper-2);border-radius:1px}
.mc.m{background:var(--verdigris)}
.mc.w{background:var(--maroon)}
.mc.t{background:var(--brass)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;margin-inline-end:6px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;direction:ltr}
.hc{aspect-ratio:1;background:var(--paper-2);border-radius:1px}
.hc.l1{background:#C6D5CF}.hc.l2{background:#8FB3A8}.hc.l3{background:#5A9081}.hc.l4{background:var(--verdigris)}
.juzs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.jz{border:1px solid var(--rule);background:var(--card);padding:9px 10px;position:relative;overflow:hidden}
.jz .n{font-family:var(--mono);font-size:10px;color:var(--muted);position:relative;z-index:1}
.jz .p{font-family:var(--display);font-size:17px;position:relative;z-index:1}
.jz i{position:absolute;inset-inline-start:0;bottom:0;top:0;background:var(--verd-soft);width:0;transition:width .6s}
.jz.full{border-color:var(--verdigris)}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:start;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:0 0 10px;padding-inline-end:12px;border-bottom:1px solid var(--ink)}
.tbl td{text-align:start;padding:11px 0;padding-inline-end:12px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
.tbl td:first-child{color:var(--ink);font-weight:500}
.tbl .src{font-family:var(--mono);font-size:11px;color:var(--verdigris)}
.tbl tr:last-child td{border-bottom:none}

/* ---------- ROUTINE ---------- */
.sec{padding:30px 0;border-bottom:1px solid var(--rule)}
.sec:first-child{padding-top:0}
.sec:last-child{border-bottom:none}
.ramp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:16px}
.rs{background:var(--paper);padding:16px 15px}
.rs .wk{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.rs .big{font-family:var(--display);font-size:25px;line-height:1.2}
.rs .big span{font-size:13px;color:var(--muted);font-family:var(--body)}
.rs .note{font-size:13px;color:var(--muted);margin-top:7px}
.rs.now{background:var(--ink)}
.rs.now .wk{color:var(--brass)}.rs.now .big{color:var(--paper)}
.rs.now .big span,.rs.now .note{color:#98A2B3}
.warn{border-inline-start:3px solid var(--maroon);background:var(--maroon-soft);padding:16px 18px;margin-top:16px}
.warn h3{margin-bottom:6px}
.warn p{font-size:14.5px;color:var(--ink-2)}
.warn p + p{margin-top:8px}
.note-box{border-inline-start:3px solid var(--brass);background:var(--brass-soft);padding:16px 18px;margin-top:16px}
.note-box h3{margin-bottom:6px}
.note-box p{font-size:14.5px;color:var(--ink-2)}

/* ---------- SETTINGS ---------- */
.act{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.abtn{padding:10px 17px;border:1px solid var(--ink-3);font-size:14.5px}
.abtn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.abtn.danger{border-color:var(--maroon);color:var(--maroon)}
.abtn.danger:hover{background:var(--maroon);color:#fff}
.abtn.go{background:var(--verdigris);border-color:var(--verdigris);color:#fff}
.abtn.go:hover{background:var(--ink);border-color:var(--ink)}
.syncline{font-size:13.5px;color:var(--muted);margin-bottom:12px}
.syncline b{color:var(--ink)}

/* ---------- TIMER ---------- */
.tbar{
  position:fixed;inset-inline:0;bottom:0;z-index:60;background:var(--ink);color:var(--paper);
  padding:13px 20px calc(13px + env(safe-area-inset-bottom));
  display:none;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--brass);
}
.tbar.on{display:flex}
.tbar .nm{font-size:14px;color:#9BA5B5;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar .cl{font-family:var(--mono);font-size:24px;color:var(--brass);flex:none;direction:ltr}
.tbar .x{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);padding:7px 12px;flex:none}
.tbar .x:hover{background:var(--paper);color:var(--ink)}

/* ---------- REPORT ---------- */
.rep{position:fixed;inset:0;z-index:70;background:rgba(19,31,53,.55);display:none;overflow-y:auto;padding:22px 14px}
.rep.on{display:block}
.sheet{max-width:720px;margin:0 auto;background:#fff;padding:36px 34px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:22px}
.sheet-h .ti{font-family:var(--display);font-size:25px;line-height:1.4}
.sheet-h .su{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin-top:5px}
.sheet-h .sig{font-family:var(--arabic);font-size:30px;color:var(--brass);line-height:1}
.sheet h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--verdigris);margin:26px 0 10px}
.sheet .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.sheet .g4{background:#fff;padding:13px 12px}
.sheet .g4 .v{font-family:var(--display);font-size:22px;line-height:1.2}
.sheet .g4 .l{font-family:var(--mono);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:block;margin-top:4px}
.sheet .sign{margin-top:34px;padding-top:20px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap}
.sheet .sign div{flex:1;min-width:170px}
.sheet .sign .ln{border-bottom:1px solid var(--ink);height:36px}
.sheet .sign .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.rep-act{max-width:720px;margin:16px auto 0;display:flex;gap:10px;flex-wrap:wrap}
.rep-act .abtn{background:#fff}
.ok{color:var(--verdigris);font-weight:600}
.no{color:var(--maroon);font-weight:600}

/* ---------- ONBOARD ---------- */
.ob{position:fixed;inset:0;z-index:80;background:var(--ink);color:var(--paper);overflow-y:auto;display:none}
.ob.on{display:block}
.ob-in{max-width:480px;margin:0 auto;padding:52px 24px calc(48px + env(safe-area-inset-bottom))}
.ob h1{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.35;margin:14px 0 12px}
.ob h1 em{font-style:normal;color:var(--brass)}
.ob p.lede{color:#9BA5B5;font-size:15px;margin-bottom:26px}
.ob .fld label{color:#7D8798}
.ob .fld input,.ob .fld select{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.2);color:var(--paper)}
.ob .fld option{background:#1B2942}
.ob .hint{color:#7D8798}

footer{background:var(--ink);color:#69717F;padding:26px 0;font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
footer b{color:#9BA5B5;font-weight:500}

@media print{
  body{background:#fff}
  .top,.tabs,main,footer,.tbar,.rep-act,.ob{display:none!important}
  .rep{position:static;display:block!important;background:#fff;padding:0;overflow:visible}
  .sheet{max-width:100%;padding:0}
  @page{margin:16mm}
}
@media (max-width:520px){
  body{font-size:15.5px}
  .wrap{padding:0 16px}
  h2{font-size:23px}
  .mushafmap{grid-template-columns:repeat(22,1fr)}
  .tab{font-size:13.5px;padding:12px 2px}
  .brand .nm{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="ob" id="ob"><div class="ob-in" id="ob-in"></div></div>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="mark">حفظ</span>
      <span><span class="nm" id="hdr-name"></span><span class="dt" id="hdr-date"></span></span>
    </div>
    <div class="streak">
      <span class="v" id="hdr-streak">0</span>
      <span class="l" id="hdr-streak-l"></span>
    </div>
  </div>
  <div class="wrap topbtns">
    <select class="langpick" id="langpick" aria-label="Language"></select>
    <button class="sync" id="sync-chip"><span class="dot"></span><span id="sync-txt"></span></button>
  </div>
  <nav class="tabs"><div class="wrap" id="tabs"></div></nav>
</header>

<main class="wrap">
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-routine"></section>
  <section class="view" id="v-progress"></section>
  <section class="view" id="v-settings"></section>
</main>

<div class="rep" id="rep">
  <div class="sheet" id="sheet"></div>
  <div class="rep-act">
    <button class="abtn" id="rep-print"></button>
    <button class="abtn" id="rep-close"></button>
  </div>
</div>

<div class="tbar" id="tbar">
  <span class="nm" id="tbar-nm"></span>
  <span class="cl" id="tbar-cl">00:00</span>
  <button class="x" id="tbar-x"></button>
</div>

<footer><div class="wrap"><span id="ft1"></span><span id="ft2"></span></div></footer>

<script>
"use strict";
/* =========================================================
   হিফজ · দৈনিক সঙ্গী  —  Hifz Daily Companion
   Single-file app. No server, no build step.
   All user-facing text lives in lang/*.js — never here.
   ========================================================= */

/* ---------- language registry ----------
   To add a language: create lang/xx.js (copy lang/en.js),
   then add its code to this list. Nothing else changes. */
var LANGS = ["bn", "en", "ur", "zh"];
var FALLBACK = "en";

var L = null;
var LANG_CACHE = {};

function loadLangFile(code){
  return new Promise(function(res, rej){
    if (window["HIFZ_LANG_" + code]) return res(window["HIFZ_LANG_" + code]);
    var s = document.createElement("script");
    s.src = "lang/" + code + ".js";
    s.onload = function(){ res(window["HIFZ_LANG_" + code] || null); };
    s.onerror = function(){ rej(new Error("lang " + code)); };
    document.head.appendChild(s);
  });
}

/* any key a translation omits falls back to English */
function deepFill(target, source){
  for (var k in source){
    if (!Object.prototype.hasOwnProperty.call(source, k)) continue;
    if (target[k] === undefined || target[k] === null) target[k] = source[k];
    else if (typeof target[k] === "object" && !Array.isArray(target[k]) && typeof source[k] === "object")
      deepFill(target[k], source[k]);
  }
  return target;
}

async function setLang(code, rerender){
  if (LANGS.indexOf(code) < 0) code = FALLBACK;
  if (!LANG_CACHE[code]){
    try { LANG_CACHE[code] = await loadLangFile(code); }
    catch(e){ code = FALLBACK; }
  }
  if (!LANG_CACHE[FALLBACK]) LANG_CACHE[FALLBACK] = await loadLangFile(FALLBACK);
  if (!LANG_CACHE[code]) code = FALLBACK;

  L = deepFill(JSON.parse(JSON.stringify(LANG_CACHE[code])), LANG_CACHE[FALLBACK]);

  document.documentElement.lang = L.code;
  document.documentElement.dir  = L.dir;
  document.title = L.app.title;
  var r = document.documentElement.style;
  r.setProperty("--display", L.fonts.display);
  r.setProperty("--body", L.fonts.body);
  r.setProperty("--lh", L.fonts.lineHeight);
  document.getElementById("fontlink").href =
    "https://fonts.googleapis.com/css2?family=" + L.fonts.google +
    "&family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap";

  if (S){ S.settings.lang = code; save(); }
  if (rerender) renderAll();
}

function detectLang(){
  var nav = (navigator.language || "en").toLowerCase();
  for (var i = 0; i < LANGS.length; i++) if (nav.indexOf(LANGS[i]) === 0) return LANGS[i];
  return FALLBACK;
}

/* fmt("Page {0}", 12) → "Page 12" */
function fmt(str){
  var a = arguments;
  return String(str == null ? "" : str).replace(/\{(\d+)\}/g, function(m, i){
    var v = a[(+i) + 1];
    return v === undefined ? m : v;
  });
}

/* ---------- numbers & dates ---------- */
function n(x){
  var d = (L && L.digits) || "0123456789";
  return String(x).replace(/\d/g, function(c){ return d[+c]; });
}
function pad(x){ return x < 10 ? "0" + x : "" + x; }
function key(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parseKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addDays(d, x){ var y = new Date(d.getTime()); y.setDate(y.getDate() + x); return y; }
function daysBetween(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function longDate(d){ return n(d.getDate()) + " " + L.months[d.getMonth()] + " · " + L.weekdays[d.getDay()]; }
function shortDate(d){ return n(d.getDate()) + " " + L.monthsShort[d.getMonth()]; }

var TODAY = key(new Date());
var TOTAL_PAGES = 604;
var PER_JUZ = TOTAL_PAGES / 30;
function juzOf(p){ return Math.min(30, Math.max(1, Math.ceil(p / PER_JUZ))); }
function juzRange(j){ return [Math.round((j-1) * PER_JUZ) + 1, Math.min(TOTAL_PAGES, Math.round(j * PER_JUZ))]; }

/* ---------- storage ---------- */
var KEY = "hifz-companion-v1";
var memFallback = null;
var Store = {
  async get(){
    if (window.storage){
      try { var r = await window.storage.get(KEY, false); if (r && r.value) return JSON.parse(r.value); } catch(e){}
    }
    try { var v = localStorage.getItem(KEY); if (v) return JSON.parse(v); } catch(e){}
    return memFallback;
  },
  async set(obj){
    var s = JSON.stringify(obj);
    memFallback = obj;
    if (window.storage){ try { await window.storage.set(KEY, s, false); } catch(e){} }
    try { localStorage.setItem(KEY, s); } catch(e){}
  }
};

/* ---------- state ---------- */
var S = null;
function blankDay(){
  return { sabaq:{ pages:[], blocks:[false,false,false], done:false },
           gate:null, listen:false, sabaqi:[], salah:0,
           manzil:{ juz:0, done:false }, night:false,
           errors:0, minutes:0, note:"" };
}
function defaults(){
  return { v:1,
    settings:{ lang:null, startDate:TODAY, startPage:1, restDay:5,
               qari:"", mushaf:"", manualLines:0, drive:null },
    days:{}, weak:{}, updatedAt:Date.now() };
}
function day(k){ if (!S.days[k]) S.days[k] = blankDay(); return S.days[k]; }
var saveTimer = null;
function save(){
  S.updatedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){ Store.set(S); Sync.queue(); }, 220);
}

/* ---------- derived ---------- */
function weekNo(){ return Math.max(1, Math.floor(daysBetween(S.settings.startDate, TODAY) / 7) + 1); }
function targetLines(){
  if (S.settings.manualLines > 0) return S.settings.manualLines;
  var w = weekNo();
  return w <= 2 ? 5 : w <= 4 ? 8 : w <= 6 ? 11 : 15;
}
function phaseIdx(){ var w = weekNo(); return w <= 2 ? 0 : w <= 4 ? 1 : w <= 6 ? 2 : 3; }
function phaseNote(){ return S.settings.manualLines > 0 ? L.phase.manual : L.phase.notes[phaseIdx()]; }
function isRestDay(k){ return parseKey(k).getDay() === S.settings.restDay; }

function memorizedPages(){
  var out = [], seen = {};
  Object.keys(S.days).sort().forEach(function(k){
    var d = S.days[k];
    if (!d.sabaq.done) return;
    d.sabaq.pages.forEach(function(p){ if (!seen[p]){ seen[p] = true; out.push(p); } });
  });
  return out.sort(function(a,b){ return a - b; });
}
function nextPage(){
  var m = memorizedPages();
  return m.length ? Math.min(TOTAL_PAGES, Math.max.apply(null, m) + 1) : S.settings.startPage;
}
function sabaqiQueue(){
  var out = [];
  var keys = Object.keys(S.days).filter(function(k){ return k < TODAY && S.days[k].sabaq.done; }).sort().reverse();
  for (var i = 0; i < keys.length && out.length < 9; i++){
    var d = S.days[keys[i]];
    for (var j = 0; j < d.sabaq.pages.length; j++) out.push({ page:d.sabaq.pages[j], ago:daysBetween(keys[i], TODAY) });
    if (out.length >= 7 && i >= 6) break;
  }
  return out.slice(0, 9);
}
function manzilJuz(){
  var m = memorizedPages();
  if (m.length < 8) return 0;
  var recent = {};
  sabaqiQueue().forEach(function(x){ recent[x.page] = true; });
  var pool = [], seen = {};
  m.forEach(function(p){ if (recent[p]) return; var j = juzOf(p); if (!seen[j]){ seen[j] = true; pool.push(j); } });
  if (!pool.length) return 0;
  return pool[Math.floor(daysBetween(S.settings.startDate, TODAY) / 7) % pool.length];
}
function weakPages(){
  return Object.keys(S.weak).filter(function(p){ return S.weak[p]; })
    .map(Number).sort(function(a,b){ return a-b; });
}
function dayScore(k){
  var d = S.days[k]; if (!d) return 0;
  var got = 0, tot = 0;
  if (!isRestDay(k)){ tot++; if (d.sabaq.done) got++; }
  tot++; if (d.listen) got++;
  tot++; if (d.sabaqi.length) got++;
  tot++; if (d.salah >= 2) got++;
  tot++; if (d.manzil.done) got++;
  tot++; if (d.night) got++;
  return tot ? got / tot : 0;
}
function streak(){
  var c = 0, d = new Date();
  for (var i = 0; i < 900; i++){
    var k = key(d);
    if (k === TODAY && dayScore(k) === 0){ d = addDays(d, -1); continue; }
    if (dayScore(k) >= 0.5) c++; else break;
    d = addDays(d, -1);
  }
  return c;
}
function prevSabaqDay(){
  var keys = Object.keys(S.days).filter(function(k){ return k < TODAY && S.days[k].sabaq.done; }).sort();
  return keys.length ? keys[keys.length-1] : null;
}
function consecutiveFails(){
  var c = 0, d = addDays(new Date(), -1);
  for (var i = 0; i < 14; i++){
    var g = (S.days[key(d)] || {}).gate;
    if (g === "fail") c++; else if (g === "pass") break;
    d = addDays(d, -1);
  }
  return c;
}

/* ---------- helpers ---------- */
function qa(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
function langOptions(sel){
  return LANGS.map(function(c){
    var nm = (LANG_CACHE[c] && LANG_CACHE[c].name) || c.toUpperCase();
    return '<option value="' + c + '"' + (c === sel ? " selected" : "") + '>' + nm + '</option>';
  }).join("");
}

/* ---------- timer ---------- */
var timer = { id:null, sec:0, startMins:0, block:null };
function beginTimer(name, mins){
  stopTimer(true);
  timer.startMins = mins; timer.sec = mins * 60; timer.block = name;
  document.getElementById("tbar").classList.add("on");
  document.getElementById("tbar-nm").textContent = name;
  tick(); timer.id = setInterval(tick, 1000);
}
function tick(){
  var m = Math.floor(Math.abs(timer.sec) / 60), s = Math.abs(timer.sec) % 60;
  document.getElementById("tbar-cl").textContent = (timer.sec < 0 ? "+" : "") + n(pad(m)) + ":" + n(pad(s));
  timer.sec--;
  if (timer.sec === -1 && navigator.vibrate){ try { navigator.vibrate([200,100,200]); } catch(e){} }
}
function stopTimer(silent){
  if (timer.id){
    clearInterval(timer.id); timer.id = null;
    if (!silent && timer.block){
      day(TODAY).minutes += Math.max(1, Math.round((timer.startMins * 60 - timer.sec) / 60));
      save();
    }
  }
  document.getElementById("tbar").classList.remove("on");
}

/* ---------- chrome ---------- */
function renderChrome(){
  document.getElementById("hdr-name").textContent = L.app.name;
  document.getElementById("hdr-date").textContent = longDate(new Date());
  document.getElementById("hdr-streak").textContent = n(streak());
  document.getElementById("hdr-streak-l").textContent = L.app.streak;
  document.getElementById("ft1").innerHTML = L.app.footer1;
  document.getElementById("ft2").textContent = L.app.footer2;
  document.getElementById("tbar-x").textContent = L.timer.stop;
  document.getElementById("rep-print").textContent = L.rep.print;
  document.getElementById("rep-close").textContent = L.rep.close;

  var cur = qa(".tab").filter(function(t){ return t.getAttribute("aria-selected") === "true"; });
  var active = cur.length ? cur[0].dataset.v : "today";
  document.getElementById("tabs").innerHTML =
    ["today","routine","progress","settings"].map(function(v){
      return '<button class="tab" data-v="' + v + '" aria-selected="' + (v === active) + '">' + L.nav[v] + '</button>';
    }).join("");
  qa(".tab").forEach(function(t){
    t.onclick = function(){
      qa(".tab").forEach(function(x){ x.setAttribute("aria-selected", x === t ? "true" : "false"); });
      qa(".view").forEach(function(x){ x.classList.remove("on"); });
      document.getElementById("v-" + t.dataset.v).classList.add("on");
      window.scrollTo({ top:0, behavior:"smooth" });
    };
  });

  var lp = document.getElementById("langpick");
  lp.innerHTML = langOptions(L.code);
  lp.onchange = function(){ setLang(this.value, true); };
}

/* ---------- onboarding ---------- */
function renderOnboard(){
  var o = L.ob, days = [5,6,0,4,1,2,3];
  document.getElementById("ob-in").innerHTML =
    '<div class="kicker" style="color:var(--brass)">' + o.kicker + '</div>' +
    '<h1>' + o.h1a + '<br><em>' + o.h1b + '</em></h1>' +
    '<p class="lede">' + o.lede + '</p>' +
    '<div class="fld"><label for="ob-lang">' + o.lang + '</label>' +
      '<select id="ob-lang">' + langOptions(L.code) + '</select></div>' +
    '<div class="fld"><label for="ob-date">' + o.date + '</label>' +
      '<input type="date" id="ob-date" value="' + TODAY + '"><div class="hint">' + o.dateHint + '</div></div>' +
    '<div class="fld"><label for="ob-page">' + o.page + '</label>' +
      '<input type="number" id="ob-page" min="1" max="604" value="1"><div class="hint">' + o.pageHint + '</div></div>' +
    '<div class="fld"><label for="ob-rest">' + o.rest + '</label><select id="ob-rest">' +
      days.map(function(d){ return '<option value="' + d + '">' + L.weekdays[d] + '</option>'; }).join("") +
      '</select><div class="hint">' + o.restHint + '</div></div>' +
    '<button class="abtn go" id="ob-go" style="margin-top:10px">' + o.go + '</button>';

  document.getElementById("ob-lang").onchange = function(){
    setLang(this.value, true).then(function(){
      renderOnboard();
      document.getElementById("ob").classList.add("on");
    });
  };
  document.getElementById("ob-go").onclick = async function(){
    S.settings.startDate = document.getElementById("ob-date").value || TODAY;
    S.settings.startPage = Math.max(1, Math.min(604, +document.getElementById("ob-page").value || 1));
    S.settings.restDay   = +document.getElementById("ob-rest").value;
    await Store.set(S);
    document.getElementById("ob").classList.remove("on");
    renderAll();
  };
}

/* ---------- TODAY ---------- */
function card(i, ar, title, meta, done, k, body){
  return '<div class="blk' + (done ? " done" : "") + '">' +
    '<div class="blk-h"><span class="idx">' + n(i) + '</span>' +
    '<span class="txt"><span class="ttl">' + (ar ? '<span class="ar">' + ar + '</span>' : '') + title + '</span>' +
    '<span class="meta">' + meta + '</span></span>' +
    '<button class="tog" data-tog="' + k + '" aria-pressed="' + done + '" aria-label="' + L.blk.doneLabel + '"></button></div>' +
    '<div class="blk-b">' + body + '</div></div>';
}
function pageGrid(lines, blocks){
  var w = [100,96,100,93,98,100,94,99,100,92,97,100,95,100,74];
  var nb = Math.ceil(lines / 5), h = '<div class="pg">';
  for (var b = 0; b < nb; b++){
    var from = b * 5, to = Math.min(lines, from + 5);
    h += '<button class="pgb" data-blk="' + b + '" aria-pressed="' + !!blocks[b] + '">';
    for (var i = from; i < to; i++){
      h += '<div class="pgrow"><span class="pgn">' + n(i+1) + '</span>' +
           '<div class="pgl" style="width:' + w[i % 15] + '%"></div></div>';
    }
    h += '</button>';
  }
  return h + '</div>';
}

function renderToday(){
  var d = day(TODAY);
  var rest = isRestDay(TODAY), lines = targetLines();
  var prev = prevSabaqDay(), blocked = (d.gate === "fail");
  var prevPages = prev ? S.days[prev].sabaq.pages : [];

  if (blocked && prevPages.length) d.sabaq.pages = prevPages.slice();
  else if (!d.sabaq.pages.length && !rest) d.sabaq.pages = [nextPage()];

  var pagesTxt = d.sabaq.pages.map(n).join(", ");
  var h = "";

  h += '<div class="phase"><div>' +
       '<div class="a">' + fmt(L.phase.week, n(weekNo())) + ' · ' +
         (rest ? L.phase.rest : fmt(L.phase.target, n(lines))) + '</div>' +
       '<div class="b">' + (rest ? L.phase.noNew : fmt(L.phase.page, pagesTxt)) + '</div></div>' +
       '<div class="c">' + (rest ? L.phase.restNote : phaseNote()) + '</div></div>';

  if (prev){
    var cls = d.gate === "pass" ? " pass" : d.gate === "fail" ? " fail" : "";
    h += '<div class="gate' + cls + '">' +
         '<div class="q">' + fmt(L.gate.q, S.days[prev].sabaq.pages.map(n).join(", ")) + '</div>' +
         '<div class="btns">' +
         '<button class="gbtn' + (d.gate === "pass" ? " sel-y" : "") + '" data-gate="pass">' + L.gate.yes + '</button>' +
         '<button class="gbtn' + (d.gate === "fail" ? " sel-n" : "") + '" data-gate="fail">' + L.gate.no + '</button></div>';
    if (d.gate === "fail"){
      var f = consecutiveFails();
      h += '<div class="verdict">' + L.gate.fail + (f >= 2 ? fmt(L.gate.failStreak, n(f)) : "") + '</div>';
    } else if (d.gate === "pass"){
      h += '<div class="verdict">' + L.gate.pass + '</div>';
    }
    h += '</div>';
  }

  if (!rest){
    var nb = Math.ceil(lines / 5);
    var head = blocked ? '<p style="margin-bottom:12px">' + L.sabaq.blocked + '</p>'
      : '<div class="fld" style="margin-bottom:14px"><label for="sq-page">' + L.sabaq.pageLabel + '</label>' +
        '<input type="number" id="sq-page" min="1" max="604" value="' + d.sabaq.pages[0] + '" style="max-width:150px">' +
        '<div class="hint">' + L.sabaq.pageHint + '</div></div>';
    h += card(1, "سَبَق", blocked ? L.blk.sabaqRepeat : L.blk.sabaq,
      fmt(L.blk.sabaqMeta, pagesTxt, n(lines)), d.sabaq.done, "sabaq",
      head + pageGrid(lines, d.sabaq.blocks) +
      '<p style="margin-bottom:10px">' + L.sabaq.intro + '</p>' +
      '<ol class="steps">' + L.sabaq.drill.map(function(s){ return '<li>' + s + '</li>'; }).join("") + '</ol>' +
      '<p style="margin-top:10px">' + fmt(L.sabaq.after, n(nb)) + '</p>' +
      '<button class="tbtn" data-timer="' + L.blk.sabaq + '|50">' + fmt(L.timer.start, n(50)) + '</button>');
  }

  h += card(2, "", L.blk.listen, L.blk.listenMeta, d.listen, "listen",
    '<p>' + L.listen.body + (S.settings.qari ? fmt(L.listen.qari, esc(S.settings.qari)) : "") + '</p>');

  var q = sabaqiQueue(), wk = weakPages(), qh = "";
  if (q.length){
    qh += '<div class="queue">' + q.map(function(x){
      return '<button class="qp' + (S.weak[x.page] ? " weak" : "") + '" data-sq="' + x.page +
        '" aria-pressed="' + (d.sabaqi.indexOf(x.page) > -1) + '">' +
        fmt(L.sabaqi.page, n(x.page)) + '<span class="d">' + fmt(L.sabaqi.ago, n(x.ago)) + '</span></button>';
    }).join("") + '</div>';
  } else {
    qh += '<p class="empty">' + L.sabaqi.empty + '</p>';
  }
  if (wk.length){
    qh += '<p style="margin-bottom:6px">' + L.sabaqi.weakLabel + '</p><div class="queue">' +
      wk.map(function(p){
        return '<button class="qp weak" data-sq="' + p + '" aria-pressed="' + (d.sabaqi.indexOf(p) > -1) + '">' +
          fmt(L.sabaqi.page, n(p)) + '</button>';
      }).join("") + '</div>';
  }
  h += card(3, "سَبَقِي", L.blk.sabaqi, L.blk.sabaqiMeta,
    q.length > 0 && d.sabaqi.length >= Math.min(7, q.length), "sabaqi",
    qh + '<p>' + L.sabaqi.order + '</p>' +
    '<button class="tbtn" data-timer="' + L.blk.sabaqi + '|25">' + fmt(L.timer.start, n(25)) + '</button>');

  h += card(4, "", L.blk.salah, L.blk.salahMeta, d.salah >= 2, "salahX",
    '<p>' + L.salah.body + '</p>' +
    '<div class="ctr"><button class="cbtn" data-salah="-1">−</button>' +
    '<span class="cval">' + n(d.salah) + '</span>' +
    '<button class="cbtn" data-salah="1">+</button>' +
    '<span class="clbl">' + L.salah.counted + '</span></div>');

  var mj = manzilJuz(), mh;
  if (mj){
    var r = juzRange(mj);
    mh = '<p>' + fmt(L.manzil.week, n(mj), n(r[0]), n(r[1])) + '</p><p>' + L.manzil.rot + '</p>' +
         '<button class="tbtn" data-timer="' + L.blk.manzil + '|35">' + fmt(L.timer.start, n(35)) + '</button>';
  } else {
    mh = '<p class="empty">' + L.manzil.empty + '</p>';
  }
  h += card(5, "مَنْزِل", L.blk.manzil,
    mj ? fmt(L.blk.manzilMeta, n(mj)) : L.blk.manzilWait, d.manzil.done, "manzil", mh);

  h += card(6, "", L.blk.night, L.blk.nightMeta, d.night, "night", '<p>' + L.night.body + '</p>');

  h += '<div class="log">' +
    '<div class="fld"><label for="lg-err">' + L.log.err + '</label>' +
      '<input type="number" id="lg-err" min="0" max="200" value="' + d.errors + '">' +
      '<div class="hint">' + L.log.errHint + '</div></div>' +
    '<div class="fld"><label for="lg-min">' + L.log.min + '</label>' +
      '<input type="number" id="lg-min" min="0" max="600" value="' + d.minutes + '"></div>' +
    '<div class="fld"><label for="lg-note">' + L.log.note + '</label>' +
      '<textarea id="lg-note" placeholder="' + L.log.notePh + '">' + esc(d.note) + '</textarea></div>' +
    '<div class="fld"><label for="lg-weak">' + L.log.weak + '</label>' +
      '<div class="act"><input type="number" id="lg-weak" min="1" max="604" placeholder="' + L.log.weakPh + '" style="max-width:150px">' +
      '<button class="abtn" id="weak-add">' + L.log.weakAdd + '</button>' +
      (wk.length ? '<button class="abtn danger" id="weak-clr">' + L.log.weakClear + '</button>' : '') +
      '</div><div class="hint">' + L.log.weakHint + '</div></div></div>';

  var sc = Math.round(dayScore(TODAY) * 100);
  h += '<div class="sum"><div class="sum-row"><span class="lab">' + L.sum.done + '</span>' +
    '<span class="big">' + n(sc) + '%</span></div>' +
    '<div class="bar"><i style="width:' + sc + '%"></i></div>' +
    '<div class="sum-row" style="margin-top:16px"><span class="lab">' + L.sum.total + '</span>' +
    '<span style="font-family:var(--mono);font-size:13px;color:#9BA5B5">' +
    fmt(L.sum.stat, n(memorizedPages().length), n(d.minutes)) + '</span></div></div>';

  document.getElementById("v-today").innerHTML = h;

}

function bindToday(){
  var d = day(TODAY);
  qa("[data-gate]").forEach(function(b){
    b.onclick = function(){ d.gate = (d.gate === b.dataset.gate) ? null : b.dataset.gate; save(); renderToday(); };
  });
  qa("[data-tog]").forEach(function(b){
    b.onclick = function(){
      var k = b.dataset.tog;
      if (k === "sabaq") d.sabaq.done = !d.sabaq.done;
      else if (k === "listen") d.listen = !d.listen;
      else if (k === "night") d.night = !d.night;
      else if (k === "manzil"){ d.manzil.done = !d.manzil.done; d.manzil.juz = manzilJuz(); }
      else if (k === "salahX") d.salah = d.salah >= 2 ? 0 : 5;
      else if (k === "sabaqi"){
        var all = sabaqiQueue().map(function(x){ return x.page; }).concat(weakPages());
        d.sabaqi = d.sabaqi.length ? [] : all.filter(function(v,i,a){ return a.indexOf(v) === i; });
      }
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-blk]").forEach(function(b){
    b.onclick = function(){
      var i = +b.dataset.blk;
      d.sabaq.blocks[i] = !d.sabaq.blocks[i];
      var nb = Math.ceil(targetLines() / 5), all = true;
      for (var j = 0; j < nb; j++) if (!d.sabaq.blocks[j]) all = false;
      if (all) d.sabaq.done = true;
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-sq]").forEach(function(b){
    b.onclick = function(){
      var p = +b.dataset.sq, i = d.sabaqi.indexOf(p);
      if (i > -1) d.sabaqi.splice(i, 1); else d.sabaqi.push(p);
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-salah]").forEach(function(b){
    b.onclick = function(){
      d.salah = Math.max(0, Math.min(5, d.salah + (+b.dataset.salah)));
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-timer]").forEach(function(b){
    b.onclick = function(){ var p = b.dataset.timer.split("|"); beginTimer(p[0], +p[1]); };
  });
  var g = function(id){ return document.getElementById(id); };
  var sp = g("sq-page");
  if (sp) sp.onchange = function(){
    d.sabaq.pages = [Math.max(1, Math.min(604, +sp.value || 1))];
    save(); renderToday(); renderProgress();
  };
  var e = g("lg-err");   if (e)  e.onchange  = function(){ d.errors = Math.max(0, +e.value || 0); save(); };
  var m = g("lg-min");   if (m)  m.onchange  = function(){ d.minutes = Math.max(0, +m.value || 0); save(); renderToday(); };
  var nt = g("lg-note"); if (nt) nt.onchange = function(){ d.note = nt.value; save(); };
  var wa = g("weak-add");
  if (wa) wa.onclick = function(){
    var v = +g("lg-weak").value;
    if (v >= 1 && v <= 604){ S.weak[v] = true; save(); renderToday(); renderProgress(); }
  };
  var wc = g("weak-clr");
  if (wc) wc.onclick = function(){ S.weak = {}; save(); renderToday(); renderProgress(); };
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  var P = L.pg;
  var m = memorizedPages(), has = {}; m.forEach(function(p){ has[p] = true; });
  var wk = weakPages(), wkm = {}; wk.forEach(function(p){ wkm[p] = true; });
  var td = day(TODAY), tdm = {};
  if (!td.sabaq.done) td.sabaq.pages.forEach(function(p){ tdm[p] = true; });

  var juzDone = 0;
  for (var j = 1; j <= 30; j++){
    var r = juzRange(j), c = 0;
    for (var p = r[0]; p <= r[1]; p++) if (has[p]) c++;
    if (c >= r[1] - r[0] + 1) juzDone++;
  }
  var dks = Object.keys(S.days).filter(function(k){ return S.days[k].sabaq.done; }).sort();
  var span = dks.length ? Math.max(1, daysBetween(dks[0], TODAY) + 1) : 1;
  var rate = m.length / span, left = TOTAL_PAGES - m.length;
  var finish = rate > 0.02 ? addDays(new Date(), Math.round(left / rate)) : null;

  var totMin = 0, totErr = 0, nErr = 0;
  Object.keys(S.days).forEach(function(k){
    totMin += S.days[k].minutes || 0;
    if (S.days[k].errors > 0){ totErr += S.days[k].errors; nErr++; }
  });

  var vals = [n(m.length), n(juzDone), n(Math.round(m.length / TOTAL_PAGES * 100)) + "%",
              n(streak()), n(Math.round(totMin / 60)), nErr ? n(Math.round(totErr / nErr)) : "—"];

  var h = '<div class="kicker">' + P.k + '</div><h2>' + P.h + '</h2>' +
    '<div class="act" style="margin:0 0 22px"><button class="abtn go" id="pg-rep">' + P.report + '</button></div>' +
    '<div class="stats">' + vals.map(function(v, i){
      return '<div class="st"><span class="v">' + v + '</span><span class="l">' + P.stats[i] + '</span></div>';
    }).join("") + '</div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.map + '</span>' +
       '<span class="t">' + n(m.length) + ' / ' + n(TOTAL_PAGES) + '</span></div><div class="mushafmap">';
  for (var i = 1; i <= TOTAL_PAGES; i++){
    h += '<span class="mc ' + (wkm[i] ? "w" : has[i] ? "m" : tdm[i] ? "t" : "") + '"></span>';
  }
  var cols = ["var(--verdigris)","var(--brass)","var(--maroon)","var(--paper-2)"];
  h += '</div><div class="legend">' + P.legend.map(function(t, i){
    return '<span><i style="background:' + cols[i] + '"></i>' + t + '</span>';
  }).join("") + '</div></div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.heat + '</span>' +
       '<span class="t">' + P.heatNote + '</span></div><div class="heat">';
  for (var k = 83; k >= 0; k--){
    var sc = dayScore(key(addDays(new Date(), -k)));
    h += '<span class="hc ' + (sc === 0 ? "" : sc < 0.35 ? "l1" : sc < 0.6 ? "l2" : sc < 0.85 ? "l3" : "l4") + '"></span>';
  }
  h += '</div></div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.juz + '</span></div><div class="juzs">';
  for (var jj = 1; jj <= 30; jj++){
    var rr = juzRange(jj), cc = 0;
    for (var pp = rr[0]; pp <= rr[1]; pp++) if (has[pp]) cc++;
    var pct = Math.round(cc / (rr[1] - rr[0] + 1) * 100);
    h += '<div class="jz' + (pct >= 100 ? " full" : "") + '"><i style="width:' + pct + '%"></i>' +
         '<span class="n">' + n(jj) + '</span><br><span class="p">' + n(pct) + '%</span></div>';
  }
  h += '</div></div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.rate + '</span></div>' +
    '<table class="tbl"><tbody>' +
    '<tr><td>' + P.rateDaily + '</td><td>' + fmt(P.ratePages, n(rate.toFixed(2))) + '</td></tr>' +
    '<tr><td>' + P.rateLeft + '</td><td>' + fmt(P.ratePages, n(left)) + '</td></tr>' +
    '<tr><td>' + P.rateFinish + '</td><td>' +
      (finish ? longDate(finish) + " · " + n(finish.getFullYear()) : P.rateNone) + '</td></tr>' +
    '</tbody></table></div>';

  if (wk.length){
    h += '<div class="warn"><h3>' + P.weakH + '</h3><p>' +
      wk.map(function(p){ return fmt(L.rep.page, n(p)); }).join(" · ") + '</p><p>' + P.weakP + '</p></div>';
  }

  var notes = Object.keys(S.days).filter(function(k){ return S.days[k].note; }).sort().reverse().slice(0, 6);
  if (notes.length){
    h += '<div class="mapwrap" style="margin-top:28px"><div class="maplbl"><span class="t">' + P.notes +
      '</span></div><table class="tbl"><tbody>' + notes.map(function(k){
        return '<tr><td class="src">' + shortDate(parseKey(k)) + '</td><td>' + esc(S.days[k].note) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }

  document.getElementById("v-progress").innerHTML = h;
  document.getElementById("pg-rep").onclick = openReport;
}

  };

/* ---------- Google Drive sync ---------- */
var Sync = {
  tc:null, token:null, expires:0, busy:false, pushTimer:null, on:false,

  cfg:function(){
    var c = window.HIFZ_CONFIG || {};
    return c.googleClientId ? c : null;
  },
  connected:function(){ return !!(this.token && Date.now() < this.expires); },

  init:function(){
    var c = this.cfg(); if (!c) return;
    var chip = document.getElementById("sync-chip");
    chip.classList.add("show");
    chip.onclick = function(){ Sync.connected() ? Sync.pushNow(true) : Sync.connect(); };
    this.on = true;
    var self = this;
    var wait = setInterval(function(){
      if (!(window.google && google.accounts && google.accounts.oauth2)) return;
      clearInterval(wait);
      self.tc = google.accounts.oauth2.initTokenClient({
        client_id: c.googleClientId,
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: function(r){
          if (r && r.access_token){
            self.token = r.access_token;
            self.expires = Date.now() + (r.expires_in || 3000) * 1000 - 60000;
            self.afterAuth();
          } else self.status("err", L.sync.failed);
        },
        error_callback: function(){ self.status("err", L.sync.cancelled); }
      });
      if (S.settings.drive && S.settings.drive.email) self.silent();
      else self.status("", L.sync.off);
    }, 300);
    setTimeout(function(){ clearInterval(wait); }, 15000);
  },

  status:function(cls, txt){
    var chip = document.getElementById("sync-chip");
    if (!chip) return;
    chip.className = "sync show" + (cls ? " " + cls : "");
    document.getElementById("sync-txt").textContent = txt;
    var st = document.getElementById("sync-state");
    if (st) st.innerHTML = this.line();
  },

  line:function(){
    var d = S && S.settings.drive;
    if (!this.cfg()) return L.sync.noConfig;
    if (!d || !d.email) return L.sync.notLinked;
    return fmt(L.sync.linked, esc(d.email)) +
      (d.lastSync ? fmt(L.sync.last, new Date(d.lastSync).toLocaleString(L.locale)) : L.sync.never);
  },

  connect:function(){
    if (!this.tc) return alert(L.sync.notReady);
    this.status("busy", L.sync.connecting);
    this.tc.requestAccessToken({ prompt:"consent" });
  },
  silent:function(){
    if (!this.tc) return;
    this.status("busy", L.sync.connecting);
    this.tc.requestAccessToken({ prompt:"" });
  },
  disconnect:function(){
    if (this.token && window.google && google.accounts && google.accounts.oauth2){
      try { google.accounts.oauth2.revoke(this.token); } catch(e){}
    }
    this.token = null; this.expires = 0;
    S.settings.drive = null; save();
    this.status("", L.sync.off);
    renderSettings();
  },

  api:function(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ Authorization:"Bearer " + this.token }, opts.headers || {});
    return fetch(url, opts).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r;
    });
  },

  afterAuth:async function(){
    S.settings.drive = S.settings.drive || {};
    try {
      var r = await this.api("https://www.googleapis.com/oauth2/v3/userinfo");
      var u = await r.json();
      S.settings.drive.email = u.email || "Google";
    } catch(e){ S.settings.drive.email = S.settings.drive.email || "Google"; }
    await this.reconcile();
  },

  findFile:async function(){
    var name = this.cfg().driveFileName || "hifz-backup.json";
    var q = encodeURIComponent("name='" + name + "' and trashed=false");
    var r = await this.api("https://www.googleapis.com/drive/v3/files?q=" + q +
              "&spaces=drive&fields=files(id,modifiedTime)&pageSize=1");
    var j = await r.json();
    return (j.files && j.files[0]) ? j.files[0].id : null;
  },
  read:async function(id){
    var r = await this.api("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media");
    return await r.json();
  },
  write:async function(id, obj){
    var name = this.cfg().driveFileName || "hifz-backup.json";
    var body = JSON.stringify(obj, null, 2);
    if (id){
      await this.api("https://www.googleapis.com/upload/drive/v3/files/" + id + "?uploadType=media",
        { method:"PATCH", headers:{ "Content-Type":"application/json" }, body:body });
      return id;
    }
    var b = "hifzb" + Date.now();
    var multipart =
      "--" + b + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify({ name:name, mimeType:"application/json" }) + "\r\n" +
      "--" + b + "\r\nContent-Type: application/json\r\n\r\n" + body + "\r\n--" + b + "--";
    var r = await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      { method:"POST", headers:{ "Content-Type":"multipart/related; boundary=" + b }, body:multipart });
    var j = await r.json();
    return j.id;
  },

  reconcile:async function(){
    if (!this.connected()) return;
    this.busy = true; this.status("busy", L.sync.reconciling);
    try {
      var id = S.settings.drive.fileId || await this.findFile();
      if (id){
        var remote = null;
        try { remote = await this.read(id); } catch(e){}
        if (remote && remote.settings && remote.days){
          var localEmpty = Object.keys(S.days).length === 0;
          if ((remote.updatedAt || 0) > (S.updatedAt || 0) || localEmpty){
            var drive = S.settings.drive;
            S = remote; if (!S.weak) S.weak = {};
            S.settings.drive = drive; S.settings.drive.fileId = id;
            await Store.set(S);
            await setLang(S.settings.lang || L.code, false);
            renderAll();
          }
        }
      }
      S.settings.drive.fileId = await this.write(id, S);
      S.settings.drive.lastSync = Date.now();
      await Store.set(S);
      this.status("ok", L.sync.ok);
    } catch(e){ this.status("err", L.sync.failed); }
    this.busy = false;
  },

  queue:function(){
    if (!this.on || !(S.settings.drive && S.settings.drive.email)) return;
    clearTimeout(this.pushTimer);
    var self = this;
    this.pushTimer = setTimeout(function(){ self.pushNow(false); }, 4000);
  },

  pushNow:async function(loud){
    if (!this.on || !(S.settings.drive && S.settings.drive.email)) return;
    if (!this.connected()){ this.silent(); return; }
    if (this.busy) return;
    this.busy = true; this.status("busy", L.sync.pushing);
    try {
      var id = S.settings.drive.fileId || await this.findFile();
      S.settings.drive.fileId = await this.write(id, S);
      S.settings.drive.lastSync = Date.now();
      await Store.set(S);
      this.status("ok", L.sync.ok);
    } catch(e){
      this.status("err", L.sync.failed);
      if (loud) alert(L.sync.pushFail);
    }
    this.busy = false;
  },

  pullNow:async function(){
    if (!this.connected()){ this.silent(); return; }
    this.busy = true; this.status("busy", L.sync.pulling);
    try {
      var id = S.settings.drive.fileId || await this.findFile();
      if (!id) throw new Error("none");
      var remote = await this.read(id);
      if (!remote.settings || !remote.days) throw new Error("bad");
      var drive = S.settings.drive;
      S = remote; if (!S.weak) S.weak = {};
      S.settings.drive = drive;
      await Store.set(S);
      await setLang(S.settings.lang || L.code, false);
      renderAll();
      this.status("ok", L.sync.ok);
      alert(L.sync.pulled);
    } catch(e){
      this.status("err", L.sync.failed);
      alert(L.sync.pullFail);
    }
    this.busy = false;
  }
};

/* ---------- weekly report ---------- */
function openReport(){
  var Rp = L.rep, rows = [];
  var newPages = 0, totErr = 0, totMin = 0, gPass = 0, gFail = 0, done = 0;

  for (var i = 6; i >= 0; i--){
    var dt = addDays(new Date(), -i), k = key(dt), d = S.days[k], rest = isRestDay(k);
    if (!d){ rows.push({ dt:dt, pages:"—", gate:null, err:"—", min:"—", sc:0, note:"" }); continue; }
    if (d.sabaq.done){ newPages += d.sabaq.pages.length; done++; }
    totErr += d.errors || 0; totMin += d.minutes || 0;
    if (d.gate === "pass") gPass++;
    if (d.gate === "fail") gFail++;
    rows.push({ dt:dt,
      pages: d.sabaq.done ? d.sabaq.pages.map(n).join(", ") : (rest ? Rp.rest : "—"),
      gate: d.gate, err: d.errors || 0, min: d.minutes || 0,
      sc: Math.round(dayScore(k) * 100), note: d.note || "" });
  }

  var wk = weakPages(), notes = rows.filter(function(r){ return r.note; });
  var vals = [n(newPages), n(memorizedPages().length), n(totErr), n(Math.round(totMin / 60))];

  var h = '<div class="sheet-h"><div><div class="ti">' + Rp.title + '</div>' +
    '<div class="su">' + longDate(addDays(new Date(), -6)) + ' — ' + longDate(new Date()) + '</div></div>' +
    '<div class="sig">حفظ</div></div>';

  h += '<div class="grid4">' + vals.map(function(v, i){
    return '<div class="g4"><span class="v">' + v + '</span><span class="l">' + Rp.stats[i] + '</span></div>';
  }).join("") + '</div>';

  h += '<h4>' + Rp.daily + '</h4><table class="tbl"><thead><tr>' +
    Rp.th.map(function(t){ return '<th>' + t + '</th>'; }).join("") + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr><td>' + shortDate(r.dt) + '<br><span class="src">' + L.weekdays[r.dt.getDay()] + '</span></td>' +
        '<td>' + r.pages + '</td>' +
        '<td>' + (r.gate === "pass" ? '<span class="ok">' + Rp.pass + '</span>'
                : r.gate === "fail" ? '<span class="no">' + Rp.fail + '</span>' : "—") + '</td>' +
        '<td>' + (r.err === "—" ? "—" : n(r.err)) + '</td>' +
        '<td>' + (r.min === "—" ? "—" : n(r.min)) + '</td>' +
        '<td>' + n(r.sc) + '%</td></tr>';
    }).join("") + '</tbody></table>';

  h += '<h4>' + Rp.gateH + '</h4><p style="font-size:15px;color:var(--ink-2)">' +
    fmt(Rp.gateLine, n(gPass), n(gFail), n(done)) +
    (gFail === 0 ? Rp.verdictGood : gFail >= 3 ? Rp.verdictBad : Rp.verdictOk) + '</p>';

  if (wk.length){
    h += '<h4>' + Rp.weakH + '</h4><p style="font-size:15px">' +
      wk.map(function(p){ return fmt(Rp.page, n(p)); }).join(" · ") + '</p>';
  }
  if (notes.length){
    h += '<h4>' + Rp.notesH + '</h4><table class="tbl"><tbody>' + notes.map(function(r){
      return '<tr><td class="src">' + shortDate(r.dt) + '</td><td>' + esc(r.note) + '</td></tr>';
    }).join("") + '</tbody></table>';
  }

  h += '<div class="sign"><div><div class="ln"></div><div class="cap">' + Rp.comment + '</div></div>' +
    '<div><div class="ln"></div><div class="cap">' + Rp.signature + '</div></div></div>';

  document.getElementById("sheet").innerHTML = h;
  document.getElementById("rep").classList.add("on");
}

/* ---------- render all ---------- */
function renderAll(){
  renderChrome(); renderToday(); renderRoutine(); renderProgress(); renderSettings();
}

document.getElementById("tbar-x").onclick    = function(){ stopTimer(false); renderToday(); };
document.getElementById("rep-close").onclick = function(){ document.getElementById("rep").classList.remove("on"); };
document.getElementById("rep-print").onclick = function(){ window.print(); };
document.getElementById("rep").onclick       = function(e){ if (e.target === this) this.classList.remove("on"); };

/* ---------- init ---------- */
(async function init(){
  var loaded = await Store.get();
  var fresh = !(loaded && loaded.settings);

  if (fresh) S = defaults();
  else {
    S = loaded;
    if (!S.weak) S.weak = {};
    if (S.settings.manualLines == null) S.settings.manualLines = 0;
    if (S.settings.drive === undefined) S.settings.drive = null;
  }

  /* preload every language so the picker shows real names */
  await Promise.all(LANGS.map(function(c){
    return loadLangFile(c).then(function(o){ if (o) LANG_CACHE[c] = o; }).catch(function(){});
  }));

  await setLang(S.settings.lang || detectLang(), false);
  renderAll();

  if (fresh){
    renderOnboard();
    document.getElementById("ob").classList.add("on");
  }

  Sync.init();

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
})();
</script>
