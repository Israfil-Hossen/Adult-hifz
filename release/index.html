function bindToday(){
  var d = day(TODAY);
  qa("[data-gate]").forEach(function(b){
    b.onclick = function(){
      var nextGate = (d.gate === b.dataset.gate) ? null : b.dataset.gate;
      /* record once per day, and only when an answer is actually being set */
      if (nextGate && !d.gateRated){ revFromGate(nextGate); d.gateRated = true; }
      d.gate = nextGate; save(); renderToday(); };
  });
  qa(".blk-h").forEach(function(hd){
    hd.onclick = function(e){
      if (e.target.closest("[data-tog]")) return;
      var w = hd.parentNode, k = w.dataset.blkk;
      OPEN[k] = !w.classList.contains("open");
      w.classList.toggle("open", !!OPEN[k]);
    };
  });
  qa("[data-tog]").forEach(function(b){
    b.onclick = function(){
      var k = b.dataset.tog;
      if (k === "sabaq") d.sabaq.done = !d.sabaq.done;
      else if (k === "listen") d.listen = !d.listen;
      else if (k === "night") d.night = !d.night;
      else if (k === "manzil"){ d.manzil.done = !d.manzil.done; d.manzil.juz = manzilJuz(); }
      else if (k === "salahX") d.salah = d.salah >= 2 ? 0 : 5;
      else if (k === "sabaqi"){
        var all = sabaqiQueue().map(function(x){ return x.page; }).concat(weakPages());
        d.sabaqi = d.sabaqi.length ? [] : all.filter(function(v,i,a){ return a.indexOf(v) === i; });
      }
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-blk]").forEach(function(b){
    b.onclick = function(){
      var i = +b.dataset.blk;
      d.sabaq.blocks[i] = !d.sabaq.blocks[i];
      var cnt = Math.max(1, (d.sabaq.to || targetLines()) - (d.sabaq.from || 1) + 1);
      var nb = Math.ceil(cnt / 5), all = true;
      for (var j = 0; j < nb; j++) if (!d.sabaq.blocks[j]) all = false;
      if (all) d.sabaq.done = true;
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-sq]").forEach(function(b){
    b.onclick = function(){
      var p = +b.dataset.sq, i = d.sabaqi.indexOf(p);
      if (i > -1){ d.sabaqi.splice(i, 1); d.rateAsk = 0; }
      else { d.sabaqi.push(p); d.rateAsk = p; }
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-openpage]").forEach(function(b){
    b.onclick = function(e){
      if (e.target.closest("input, select, .pgb")) return;
      openMushaf(+b.dataset.openpage);
    };
  });
  qa("[data-rate]").forEach(function(b){
    b.onclick = function(){
      var p = b.dataset.rate.split("|");
      revRecord(+p[0], +p[1]);
      d.rateAsk = 0;
      save(); renderToday(); renderProgress();
    };
  });
  qa("[data-salah]").forEach(function(b){
    b.onclick = function(){
      d.salah = Math.max(0, Math.min(5, d.salah + (+b.dataset.salah)));
      save(); renderToday(); renderChrome();
    };
  });
  qa("[data-timer]").forEach(function(b){
    b.onclick = function(){ var p = b.dataset.timer.split("|"); beginTimer(p[0], +p[1]); };
  });
  var g = function(id){ return document.getElementById(id); };
  var sp = g("sq-page");
  if (sp) sp.onchange = function(){
    d.sabaq.pages  = [Math.max(1, Math.min(TOTAL_PAGES, +sp.value || 1))];
    d.sabaq.from   = 1;
    d.sabaq.to     = Math.min(LINES_PER_PAGE, targetLines());
    d.sabaq.blocks = [false,false,false];
    d.sabaq.done   = false;
    save(); renderToday(); renderProgress();
  };
  var e = g("lg-err");   if (e)  e.onchange  = function(){ d.errors = Math.max(0, +e.value || 0); save(); };
  var m = g("lg-min");   if (m)  m.onchange  = function(){ d.minutes = Math.max(0, +m.value || 0); save(); renderToday(); };
  var nt = g("lg-note"); if (nt) nt.onchange = function(){ d.note = nt.value; save(); };
  var wa = g("weak-add");
  if (wa) wa.onclick = function(){
    var v = +g("lg-weak").value;
    if (v >= 1 && v <= TOTAL_PAGES){ S.weak[v] = true; save(); renderToday(); renderProgress(); }
  };
  var wc = g("weak-clr");
  if (wc) wc.onclick = function(){ S.weak = {}; save(); renderToday(); renderProgress(); };
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  var P = L.pg;
  var m = memorizedPages(), has = {}; m.forEach(function(p){ has[p] = true; });
  var wk = weakPages(), wkm = {}; wk.forEach(function(p){ wkm[p] = true; });
  var td = day(TODAY), tdm = {};
  if (!td.sabaq.done) td.sabaq.pages.forEach(function(p){ tdm[p] = true; });
  var partial = pageDoneLines();
  Object.keys(partial).forEach(function(p){ if (partial[p] < LINES_PER_PAGE) tdm[p] = true; });

  var juzDone = 0;
  for (var j = 1; j <= 30; j++){
    var r = juzRange(j), c = 0;
    for (var p = r[0]; p <= r[1]; p++) if (has[p]) c++;
    if (c >= r[1] - r[0] + 1) juzDone++;
  }
  var dks = Object.keys(S.days).filter(function(k){ return S.days[k].sabaq.done; }).sort();
  var span = dks.length ? Math.max(1, daysBetween(dks[0], TODAY) + 1) : 1;
  var rate = m.length / span, left = TOTAL_PAGES - m.length;
  var finish = rate > 0.02 ? addDays(new Date(), Math.round(left / rate)) : null;

  var totMin = 0, totErr = 0, nErr = 0;
  Object.keys(S.days).forEach(function(k){
    totMin += S.days[k].minutes || 0;
    if (S.days[k].errors > 0){ totErr += S.days[k].errors; nErr++; }
  });

  var vals = [n(m.length), n(juzDone), n(Math.round(m.length / TOTAL_PAGES * 100)) + "%",
              n(streak()), n(Math.round(totMin / 60)), nErr ? n(Math.round(totErr / nErr)) : "—"];

  var due = revDue();
  var h = '<div class="kicker">' + P.k + '</div><h2>' + P.h + '</h2>' +
    '<p class="intro" style="margin-bottom:16px">' +
      (due.length ? L.rev.due + ': ' + due.slice(0, 12).map(n).join(", ") : L.rev.dueNone) +
      ' · ' + L.rev.note + '</p>' +
    '<div class="act" style="margin:0 0 22px"><button class="abtn go" id="pg-rep">' + P.report + '</button></div>' +
    '<div class="stats">' + vals.map(function(v, i){
      return '<div class="st"><span class="v">' + v + '</span><span class="l">' + P.stats[i] + '</span></div>';
    }).join("") + '</div>';

  h += '<div style="margin:18px 0 4px">' + fcCardHTML() + '</div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.map + '</span>' +
       '<span class="t">' + n(m.length) + ' / ' + n(TOTAL_PAGES) + '</span></div><div class="mushafmap">';
  for (var i = 1; i <= TOTAL_PAGES; i++){
    h += '<span class="mc ' + (wkm[i] ? "w" : has[i] ? "m" : tdm[i] ? "t" : "") + '"></span>';
  }
  var cols = ["var(--verdigris)","var(--brass)","var(--maroon)","var(--paper-2)"];
  h += '</div><div class="legend">' + P.legend.map(function(t, i){
    return '<span><i style="background:' + cols[i] + '"></i>' + t + '</span>';
  }).join("") + '</div></div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.heat + '</span>' +
       '<span class="t">' + P.heatNote + '</span></div><div class="heat">';
  for (var k = 83; k >= 0; k--){
    var sc = dayScore(key(addDays(new Date(), -k)));
    h += '<span class="hc ' + (sc === 0 ? "" : sc < 0.35 ? "l1" : sc < 0.6 ? "l2" : sc < 0.85 ? "l3" : "l4") + '"></span>';
  }
  h += '</div></div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.juz + '</span></div><div class="juzs">';
  for (var jj = 1; jj <= 30; jj++){
    var rr = juzRange(jj), cc = 0;
    for (var pp = rr[0]; pp <= rr[1]; pp++) if (has[pp]) cc++;
    var pct = Math.round(cc / (rr[1] - rr[0] + 1) * 100);
    h += '<div class="jz' + (pct >= 100 ? " full" : "") + '"><i style="width:' + pct + '%"></i>' +
         '<span class="n">' + n(jj) + '</span><br><span class="p">' + n(pct) + '%</span></div>';
  }
  h += '</div></div>';

  h += '<div class="mapwrap"><div class="maplbl"><span class="t">' + P.rate + '</span></div>' +
    '<table class="tbl"><tbody>' +
    '<tr><td>' + P.rateDaily + '</td><td>' + fmt(P.ratePages, n(rate.toFixed(2))) + '</td></tr>' +
    '<tr><td>' + P.rateLeft + '</td><td>' + fmt(P.ratePages, n(left)) + '</td></tr>' +
    '<tr><td>' + P.rateFinish + '</td><td>' +
      (finish ? longDate(finish) + " · " + n(finish.getFullYear()) : P.rateNone) + '</td></tr>' +
    '</tbody></table></div>';

  if (wk.length){
    h += '<div class="warn"><h3>' + P.weakH + '</h3><p>' +
      wk.map(function(p){ return fmt(L.rep.page, n(p)); }).join(" · ") + '</p><p>' + P.weakP + '</p></div>';
  }

  var notes = Object.keys(S.days).filter(function(k){ return S.days[k].note; }).sort().reverse().slice(0, 6);
  if (notes.length){
    h += '<div class="mapwrap" style="margin-top:28px"><div class="maplbl"><span class="t">' + P.notes +
      '</span></div><table class="tbl"><tbody>' + notes.map(function(k){
        return '<tr><td class="src">' + shortDate(parseKey(k)) + '</td><td>' + esc(S.days[k].note) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }

  document.getElementById("v-progress").innerHTML = h;
  document.getElementById("pg-rep").onclick = openReport;
}

/* ---------- Google Drive sync ---------- */
var Sync = {
  tc:null, token:null, expires:0, busy:false, pushTimer:null, on:false,

  cfg:function(){
    var c = window.HIFZ_CONFIG || {};
    return c.googleClientId ? c : null;
  },
  connected:function(){ return !!(this.token && Date.now() < this.expires); },

  init:function(){
    var c = this.cfg(); if (!c) return;
    var chip = document.getElementById("sync-chip");
    chip.classList.add("show");
    chip.onclick = function(){ Sync.connected() ? Sync.pushNow(true) : Sync.connect(); };
    this.on = true;
    var self = this;
    var wait = setInterval(function(){
      if (!(window.google && google.accounts && google.accounts.oauth2)) return;
      clearInterval(wait);
      self.tc = google.accounts.oauth2.initTokenClient({
        client_id: c.googleClientId,
        scope: "https://www.googleapis.com/auth/drive.file",
        callback: function(r){
          if (r && r.access_token){
            self.token = r.access_token;
            self.expires = Date.now() + (r.expires_in || 3000) * 1000 - 60000;
            self.afterAuth();
          } else self.status("err", L.sync.failed);
        },
        error_callback: function(){ self.status("err", L.sync.cancelled); }
      });
      if (S.settings.drive && S.settings.drive.email) self.silent();
      else self.status("", L.sync.off);
    }, 300);
    setTimeout(function(){ clearInterval(wait); }, 15000);
  },

  status:function(cls, txt){
    var chip = document.getElementById("sync-chip");
    if (!chip) return;
    chip.className = "sync show" + (cls ? " " + cls : "");
    document.getElementById("sync-txt").textContent = txt;
    var st = document.getElementById("sync-state");
    if (st) st.innerHTML = this.line();
  },

  line:function(){
    var d = S && S.settings.drive;
    if (!this.cfg()) return L.sync.noConfig;
    if (!d || !d.email) return L.sync.notLinked;
    return fmt(L.sync.linked, esc(d.email)) +
      (d.lastSync ? fmt(L.sync.last, new Date(d.lastSync).toLocaleString(L.locale)) : L.sync.never);
  },

  connect:function(){
    if (!this.tc) return alert(L.sync.notReady);
    this.status("busy", L.sync.connecting);
    this.tc.requestAccessToken({ prompt:"consent" });
  },
  silent:function(){
    if (!this.tc) return;
    this.status("busy", L.sync.connecting);
    this.tc.requestAccessToken({ prompt:"" });
  },
  disconnect:function(){
    if (this.token && window.google && google.accounts && google.accounts.oauth2){
      try { google.accounts.oauth2.revoke(this.token); } catch(e){}
    }
    this.token = null; this.expires = 0;
    S.settings.drive = null; save();
    this.status("", L.sync.off);
    renderSettings();
  },

  api:function(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({ Authorization:"Bearer " + this.token }, opts.headers || {});
    return fetch(url, opts).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r;
    });
  },

  afterAuth:async function(){
    S.settings.drive = S.settings.drive || {};
    try {
      var r = await this.api("https://www.googleapis.com/oauth2/v3/userinfo");
      var u = await r.json();
      S.settings.drive.email = u.email || "Google";
    } catch(e){ S.settings.drive.email = S.settings.drive.email || "Google"; }
    await this.reconcile();
  },

  findFile:async function(){
    var name = this.cfg().driveFileName || "hifz-backup.json";
    var q = encodeURIComponent("name='" + name + "' and trashed=false");
    var r = await this.api("https://www.googleapis.com/drive/v3/files?q=" + q +
              "&spaces=drive&fields=files(id,modifiedTime)&pageSize=1");
    var j = await r.json();
    return (j.files && j.files[0]) ? j.files[0].id : null;
  },
  read:async function(id){
    var r = await this.api("https://www.googleapis.com/drive/v3/files/" + id + "?alt=media");
    return await r.json();
  },
  write:async function(id, obj){
    var name = this.cfg().driveFileName || "hifz-backup.json";
    var body = JSON.stringify(obj, null, 2);
    if (id){
      await this.api("https://www.googleapis.com/upload/drive/v3/files/" + id + "?uploadType=media",
        { method:"PATCH", headers:{ "Content-Type":"application/json" }, body:body });
      return id;
    }
    var b = "hifzb" + Date.now();
    var multipart =
      "--" + b + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
      JSON.stringify({ name:name, mimeType:"application/json" }) + "\r\n" +
      "--" + b + "\r\nContent-Type: application/json\r\n\r\n" + body + "\r\n--" + b + "--";
    var r = await this.api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",
      { method:"POST", headers:{ "Content-Type":"multipart/related; boundary=" + b }, body:multipart });
    var j = await r.json();
    return j.id;
  },

  reconcile:async function(){
    if (!this.connected()) return;
    this.busy = true; this.status("busy", L.sync.reconciling);
    try {
      var id = S.settings.drive.fileId || await this.findFile();
      if (id){
        var remote = null;
        try { remote = await this.read(id); } catch(e){}
        if (remote && remote.settings && remote.days){
          var localEmpty = Object.keys(S.days).length === 0;
          if ((remote.updatedAt || 0) > (S.updatedAt || 0) || localEmpty){
            var drive = S.settings.drive;
            S = remote; if (!S.weak) S.weak = {};
            S.settings.drive = drive; S.settings.drive.fileId = id;
            await Store.set(S);
            await setLang(S.settings.lang || L.code, false);
            renderAll();
          }
        }
      }
      S.settings.drive.fileId = await this.write(id, S);
      S.settings.drive.lastSync = Date.now();
      await Store.set(S);
      this.status("ok", L.sync.ok);
    } catch(e){ this.status("err", L.sync.failed); }
    this.busy = false;
  },

  queue:function(){
    if (!this.on || !(S.settings.drive && S.settings.drive.email)) return;
    clearTimeout(this.pushTimer);
    var self = this;
    this.pushTimer = setTimeout(function(){ self.pushNow(false); }, 4000);
  },

  pushNow:async function(loud){
    if (!this.on || !(S.settings.drive && S.settings.drive.email)) return;
    if (!this.connected()){ this.silent(); return; }
    if (this.busy) return;
    this.busy = true; this.status("busy", L.sync.pushing);
    try {
      var id = S.settings.drive.fileId || await this.findFile();
      S.settings.drive.fileId = await this.write(id, S);
      S.settings.drive.lastSync = Date.now();
      await Store.set(S);
      this.status("ok", L.sync.ok);
    } catch(e){
      this.status("err", L.sync.failed);
      if (loud) alert(L.sync.pushFail);
    }
    this.busy = false;
  },

  pullNow:async function(){
    if (!this.connected()){ this.silent(); return; }
    this.busy = true; this.status("busy", L.sync.pulling);
    try {
      var id = S.settings.drive.fileId || await this.findFile();
      if (!id) throw new Error("none");
      var remote = await this.read(id);
      if (!remote.settings || !remote.days) throw new Error("bad");
      var drive = S.settings.drive;
      S = remote; if (!S.weak) S.weak = {};
      S.settings.drive = drive;
      await Store.set(S);
      await setLang(S.settings.lang || L.code, false);
      renderAll();
      this.status("ok", L.sync.ok);
      alert(L.sync.pulled);
    } catch(e){
      this.status("err", L.sync.failed);
      alert(L.sync.pullFail);
    }
    this.busy = false;
  }
};

/* ---------- weekly report ---------- */
function openReport(){
  var Rp = L.rep, rows = [];
  var newPages = 0, totErr = 0, totMin = 0, gPass = 0, gFail = 0, done = 0;

  for (var i = 6; i >= 0; i--){
    var dt = addDays(new Date(), -i), k = key(dt), d = S.days[k], rest = isRestDay(k);
    if (!d){ rows.push({ dt:dt, pages:"—", gate:null, err:"—", min:"—", sc:0, note:"" }); continue; }
    if (d.sabaq.done){ newPages += d.sabaq.pages.length; done++; }
    totErr += d.errors || 0; totMin += d.minutes || 0;
    if (d.gate === "pass") gPass++;
    if (d.gate === "fail") gFail++;
    rows.push({ dt:dt,
      pages: d.sabaq.done ? d.sabaq.pages.map(n).join(", ") : (rest ? Rp.rest : "—"),
      gate: d.gate, err: d.errors || 0, min: d.minutes || 0,
      sc: Math.round(dayScore(k) * 100), note: d.note || "" });
  }

  var wk = weakPages(), notes = rows.filter(function(r){ return r.note; });
  var vals = [n(newPages), n(memorizedPages().length), n(totErr), n(Math.round(totMin / 60))];

  var h = '<div class="sheet-h"><div><div class="ti">' + Rp.title + '</div>' +
    '<div class="su">' + longDate(addDays(new Date(), -6)) + ' — ' + longDate(new Date()) + '</div></div>' +
    '<div class="sig">حفظ</div></div>';

  h += '<div class="grid4">' + vals.map(function(v, i){
    return '<div class="g4"><span class="v">' + v + '</span><span class="l">' + Rp.stats[i] + '</span></div>';
  }).join("") + '</div>';

  h += '<h4>' + Rp.daily + '</h4><table class="tbl"><thead><tr>' +
    Rp.th.map(function(t){ return '<th>' + t + '</th>'; }).join("") + '</tr></thead><tbody>' +
    rows.map(function(r){
      return '<tr><td>' + shortDate(r.dt) + '<br><span class="src">' + L.weekdays[r.dt.getDay()] + '</span></td>' +
        '<td>' + r.pages + '</td>' +
        '<td>' + (r.gate === "pass" ? '<span class="ok">' + Rp.pass + '</span>'
                : r.gate === "fail" ? '<span class="no">' + Rp.fail + '</span>' : "—") + '</td>' +
        '<td>' + (r.err === "—" ? "—" : n(r.err)) + '</td>' +
        '<td>' + (r.min === "—" ? "—" : n(r.min)) + '</td>' +
        '<td>' + n(r.sc) + '%</td></tr>';
    }).join("") + '</tbody></table>';

  h += '<h4>' + Rp.gateH + '</h4><p style="font-size:15px;color:var(--ink-2)">' +
    fmt(Rp.gateLine, n(gPass), n(gFail), n(done)) +
    (gFail === 0 ? Rp.verdictGood : gFail >= 3 ? Rp.verdictBad : Rp.verdictOk) + '</p>';

  if (wk.length){
    h += '<h4>' + Rp.weakH + '</h4><p style="font-size:15px">' +
      wk.map(function(p){ return fmt(Rp.page, n(p)); }).join(" · ") + '</p>';
  }
  if (notes.length){
    h += '<h4>' + Rp.notesH + '</h4><table class="tbl"><tbody>' + notes.map(function(r){
      return '<tr><td class="src">' + shortDate(r.dt) + '</td><td>' + esc(r.note) + '</td></tr>';
    }).join("") + '</tbody></table>';
  }

  h += '<div class="sign"><div><div class="ln"></div><div class="cap">' + Rp.comment + '</div></div>' +
    '<div><div class="ln"></div><div class="cap">' + Rp.signature + '</div></div></div>';

  document.getElementById("sheet").innerHTML = h;
  document.getElementById("rep").classList.add("on");
}

var rdEl = null, rdOK = false;

       from under it looked exactly like the bug this unlock exists to fix */

async function rdFetch(url, kind){
  var c = await rdCache(), hit = c ? await c.match(url) : null;
  if (!hit){
    var r = await fetch(url, { mode:"cors" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    if (c){ try { await c.put(url, r.clone()); } catch(e){} }
    hit = r;
  }
  return kind === "json" ? hit.json() : hit.blob();
}

   a CDN for this font shows empty boxes wherever a waqf mark or an ornament
   falls. The local copy is tried first and the CDN is only the safety net. */
var NAST_LOCAL = "fonts/indopak-nastaleeq.woff2";
async function rdLoadNast(){
  var fam = "IndopakNast";
  if (RD.fonts[fam]) return fam;
  var blob = null;
  try { blob = await rdFetch(dataUrl(NAST_LOCAL)); }
  catch(e){ blob = null; }
  /* the packaged app cannot always read the file as a blob (CORS); then we let
     the browser load it itself rather than showing empty boxes */
  if (!blob){
    try { blob = await rdFetch(NAST_URL); }
    catch(e){
      if (!document.getElementById("nast-face")){
        var st = document.createElement("style");
        st.id = "nast-face";
        st.textContent = "@font-face{font-family:" + fam + ";src:url(" + dataUrl(NAST_LOCAL) +
          ") format('woff2'),url(" + NAST_URL + ") format('woff2');font-display:swap}";
        document.head.appendChild(st);
      }
      try { await document.fonts.load('16px "' + fam + '"'); } catch(e2){}
      RD.fonts[fam] = fam;
      return fam;
    }
  }
  var face = new FontFace(fam, "url(" + URL.createObjectURL(blob) + ")");
  await face.load(); document.fonts.add(face);
  RD.fonts[fam] = fam;
  return fam;

/* one continuous band behind each line's run of selected words (ayah-exact selection) */
function rdSelBands(paper){
  requestAnimationFrame(function(){
    Array.prototype.slice.call(paper.querySelectorAll(".qline")).forEach(function(line){
      Array.prototype.slice.call(line.querySelectorAll(".swband")).forEach(function(b){ b.remove(); });
      var ws = Array.prototype.slice.call(line.querySelectorAll(".w.sw"));
      if (!ws.length) return;
      var lr = line.getBoundingClientRect(), l = Infinity, r = -Infinity;
      ws.forEach(function(w){
        var wr = w.getBoundingClientRect();
        l = Math.min(l, wr.left); r = Math.max(r, wr.right);
      });
      var band = document.createElement("i");
      band.className = "swband";
      band.style.left = Math.max(0, l - lr.left - 3) + "px";
      band.style.right = Math.max(0, lr.right - r - 3) + "px";
      line.insertBefore(band, line.firstChild);
    });
  });
}

/* ---------- the page: skin, margins, curtain, swipe, glimpse ---------- */
var PAPERS = ["pcream","pday","pnight"];
function rdPaperCycle(){
  var cur = S.settings.paper || "pcream";
  S.settings.paper = PAPERS[(PAPERS.indexOf(cur) + 1) % PAPERS.length];
  save(); rdPaperSkin();
  var nm = { pcream:L.mu.pCream, pday:L.mu.pDay, pnight:L.mu.pNight }[S.settings.paper];
  if (typeof fabHint === "function") fabHint(L.mu.paper + " · " + nm);
}
function rdPaperSkin(){
  var skin = S.settings.paper || "pcream";
  qa(".paper").forEach(function(p){
    PAPERS.forEach(function(c){ p.classList.remove(c); });
    p.classList.add(skin);
    p.classList.toggle("nast", !!mushafDef().nast);
    p.classList.toggle("blind", !!RD.blind);
    p.classList.toggle("curtain", !!RD.curtainOn);
  });
  var c = document.getElementById("rd-curtain");
  if (c) c.style.height = Math.round((RD.curtain || 0) * 100) + "%";
}
/* margin bar: how firm the ayahs on this line are, from the practice record */
function rdLineFirm(pg, ln){
  var vks = {}, ws = pg.lines[ln] || [];
  ws.forEach(function(w){ if (!w.end) vks[w.vk] = 1; });
  var ks = Object.keys(vks); if (!ks.length) return "";
  var items = (S.drill && S.drill.items) || {}, seen = 0, firm = 0, weak = 0;
  ks.forEach(function(k){
    var it = items[k]; if (!it) return;
    seen++;
    if (it.streak >= 4) firm++;
    if (it.err > 0 || it.d > 6) weak++;
  });
  if (!seen) return "";
  if (weak) return "weak";
  return firm === seen ? "ok" : "";
}
/* outer ribbon: today's lesson, this week's sabaqi, older manzil */
var RIB = { page:0, sabaqi:false, manzil:false, from:0, to:0 };
function rdRibbonScan(p){
  if (RIB.page === p) return;
  var d = day(TODAY), q = [];
  try { q = sabaqiQueue() || []; } catch(e){ q = []; }
  RIB.page = p;
  RIB.from = ((d.sabaq.pages || []).indexOf(p) >= 0) ? (d.sabaq.from || 1) : 0;
  RIB.to = RIB.from ? (d.sabaq.to || LINES_PER_PAGE) : 0;
  RIB.sabaqi = q.some(function(o){ return (o && o.page ? o.page : o) === p; });
  RIB.manzil = !RIB.sabaqi && memorizedPages().indexOf(p) >= 0;
}
function rdLineRibbon(p, ln){
  rdRibbonScan(p);
  if (RIB.from && ln >= RIB.from && ln <= RIB.to) return "sabaq";
  if (RIB.sabaqi) return "sabaqi";
  if (RIB.manzil) return "manzil";
  return "";
}
function rdCurtainWire(){
  var c = document.getElementById("rd-curtain"), paper = document.getElementById("rd-paper");
  if (!c || !paper) return;
  var grab = c.querySelector(".grab"); if (!grab) return;
  var drag = false;
  grab.addEventListener("pointerdown", function(e){ drag = true; grab.setPointerCapture(e.pointerId); });
  grab.addEventListener("pointermove", function(e){
    if (!drag) return;
    var r = paper.getBoundingClientRect();
    RD.curtain = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    c.style.height = Math.round(RD.curtain * 100) + "%";
  });
  ["pointerup","pointercancel"].forEach(function(ev){
    grab.addEventListener(ev, function(){ drag = false; });
  });
}
function rdBlindWire(){
  if (!RD.blind) return;
  qa("#rd-paper .qline").forEach(function(line){
    line.addEventListener("click", function(){
      qa("#rd-paper .qline.open").forEach(function(o){ if (o !== line) o.classList.remove("open"); });
      line.classList.toggle("open");
    });
  });
}
/* swipe turns the page — left is forward, the way the book runs */
function rdSwipeWire(){
  var box = document.querySelector(".rdpapers");
  if (!box || box.dataset.sw) return;
  box.dataset.sw = "1";
  var x0 = 0, y0 = 0, live = false, tgt = null;
  function start(x, y, t){ x0 = x; y0 = y; live = true; tgt = t; }
  function end(x, y){
    if (!live) return; live = false;
    var dx = x - x0, dy = y - y0;
    /* a tap that went nowhere and did not land on anything that already
       answers a tap: that is the reader asking for the panels back, or gone */
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12){
      if (rdTapBare(tgt)) rdFocusToggle();
      return;
    }
    if (Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy) * 1.4) return;
    var fwd = dx < 0, paper = document.getElementById("rd-paper");
    if (paper) paper.classList.add(fwd ? "turnl" : "turnr");
    setTimeout(function(){
      rdStop();
      RD.page = fwd ? Math.min(TOTAL_PAGES, RD.page + 1) : Math.max(1, RD.page - 1);
      RD.sel = null; renderMushaf();
    }, 150);
  }
  box.addEventListener("touchstart", function(e){
    var t = e.touches[0]; if (t) start(t.clientX, t.clientY, e.target);
  }, { passive:true });
  box.addEventListener("touchend", function(e){
    var t = e.changedTouches[0]; if (t) end(t.clientX, t.clientY);
  }, { passive:true });
  box.addEventListener("pointerdown", function(e){ if (e.pointerType !== "touch") start(e.clientX, e.clientY, e.target); });
  box.addEventListener("pointerup", function(e){ if (e.pointerType !== "touch") end(e.clientX, e.clientY); });
}
/* bare paper = the margins and the gaps between lines. A word plays its ayah,
   the curtain grab drags, and in blind mode a whole line opens — none of those
   may be swallowed by the panel toggle. */
function rdTapBare(t){
  if (!t || !t.closest) return true;
  if (t.closest(".w, .grab, .qnum, button, a, select, input, textarea, label")) return false;
  if (RD.blind && t.closest(".qline")) return false;
  return true;
}
function rdFocusToggle(){
  if (document.body.classList.contains("focus")) rdFocusOut();
  else rdFocusIn();
}
/* ---------- what this page is about ----------
   Themes are editorial: one source cuts a page into two sections, another into
   four. So the pack is per language and the reader's own tongue wins, with
   English underneath — a surah nobody has translated yet still gets its bands. */
var TP = { data:{} };
async function topicsPack(code){
  if (TP.data[code] !== undefined) return TP.data[code];
  try { TP.data[code] = await getJSON("data/topics/" + code + ".json"); }
  catch(e){ TP.data[code] = null; }
  return TP.data[code];
}
function tpLook(pack, sn, an){
  var list = pack && pack[sn];
  if (!list || !list.length) return null;
  for (var i = 0; i < list.length; i++){
    var a = list[i].a;
    if (a && an >= a[0] && an <= a[1]) return list[i];
  }
  return null;
}
async function tpFind(sn, an){
  var mine = await topicsPack(L.code);
  var hit = tpLook(mine, sn, an);
  if (hit) return hit;
  if (L.code !== "en") return tpLook(await topicsPack("en"), sn, an);
  return null;
}
/* the sections of one page, in the order they are met, each with its colour */
async function tpForPage(pg){
  var map = {}, secs = [], order = {};
  for (var i = 0; i < pg.keys.length; i++){
    var k = pg.keys[i], pr = k.split(":"), sn = +pr[0], an = +pr[1];
    var sec = await tpFind(sn, an);
    if (!sec) continue;
    var id = sn + ":" + sec.a[0] + "-" + sec.a[1];
    if (order[id] == null){
      order[id] = secs.length;
      secs.push({ id:id, i:secs.length, t:sec.t, a:sec.a, sn:sn,
                  ci:(sec.c != null ? +sec.c : secs.length) % 6 });
    }
    map[k] = secs[order[id]];
  }
  return { map:map, secs:secs };
}

/* The overview lays each section's own shape over the page — one rectangle per
   line, from the section's first word on that line to its last, so the block
   steps exactly where the passage does. The arabic goes under it on purpose:
   this is the page seen from above, not a page to read. */
function rdTpBands(){
  var paper = document.getElementById("rd-paper");
  if (!paper) return;
  var old = paper.querySelector(".tpover");
  if (old) old.remove();
  if (RD.tp !== 2 || !RD.tpSecs || !RD.tpSecs.length) return;
  var pr = paper.getBoundingClientRect();
  var over = document.createElement("div");
  over.className = "tpover";
  var runs = {}, span = {};
  qa("#rd-paper .qline").forEach(function(line){
    var byI = {};
    Array.prototype.slice.call(line.querySelectorAll(".w[data-tp]")).forEach(function(w){
      var i = w.dataset.tp, r = w.getBoundingClientRect();
      var b = byI[i] || (byI[i] = { l:Infinity, r:-Infinity, t:Infinity, b:-Infinity });
      b.l = Math.min(b.l, r.left); b.r = Math.max(b.r, r.right);
      b.t = Math.min(b.t, r.top);  b.b = Math.max(b.b, r.bottom);
    });
    var lr = line.getBoundingClientRect();
    Object.keys(byI).forEach(function(i){
      var b = byI[i];
      (runs[i] = runs[i] || []).push({ l:b.l - pr.left, r:b.r - pr.left,
                                       t:lr.top - pr.top, h:lr.height });
      var sp = span[i] || (span[i] = { t:Infinity, b:-Infinity });
      sp.t = Math.min(sp.t, lr.top - pr.top);
      sp.b = Math.max(sp.b, lr.top - pr.top + lr.height);
    });
  });
  RD.tpSecs.forEach(function(sec){
    var rs = runs[sec.i]; if (!rs) return;
    rs.forEach(function(r){
      var d = document.createElement("i");
      d.className = "tpblk tp" + sec.ci;
      d.style.cssText = "left:" + Math.max(0, r.l - 4) + "px;width:" + Math.max(0, (r.r - r.l) + 8) +
                        "px;top:" + r.t + "px;height:" + r.h + "px";
      over.appendChild(d);
    });
    var sp = span[sec.i];
    var lo = Infinity, hi = -Infinity;
    rs.forEach(function(r){ lo = Math.min(lo, r.l); hi = Math.max(hi, r.r); });
    var lab = document.createElement("span");
    lab.className = "tplab";
    lab.style.cssText = "left:" + (lo + 8) + "px;width:" + Math.max(40, (hi - lo) - 16) + "px";
    lab.textContent = sec.t;
    lab.dataset.t = sp.t; lab.dataset.b = sp.b;
    over.appendChild(lab);
  });
  paper.appendChild(over);
  /* placed only once the labels can be measured: each sits in the middle of its
     own section, then is pushed clear of the one above so a shared boundary
     line never prints two titles on top of each other */
  var floor = 0;
  Array.prototype.slice.call(over.querySelectorAll(".tplab")).forEach(function(lab){
    var t = +lab.dataset.t, b = +lab.dataset.b, h = lab.getBoundingClientRect().height;
    var y = t + Math.max(0, (b - t - h) / 2);
    if (y < floor) y = floor;
    if (y + h > b) y = Math.max(t, b - h);
    lab.style.top = y + "px";
    lab.style.height = h + "px";
    floor = y + h + 4;
  });
}

/* ---------- this page, ayah by ayah ----------
   The mushaf page cannot carry the meaning without ceasing to be a mushaf page:
   the line breaks are the thing being memorised. So the meaning arrives over
   the page instead, and leaves it exactly as it was. */
function rdTrClose(){

/* the facing page, read-only, when the phone is held wide */
/* Every phone gets a different page: the glyph size is measured, not assumed.
   Shrink until no line overflows its width, then grow while all fifteen lines
   still fit the visible height — so one page fills one screen on a small phone
   and on a 6.8" tall one alike, and a line can never wrap. */
var RDFIT = { t:null };
function rdFit(){
  var paper = document.getElementById("rd-paper");
  if (!paper) return;
  var paper2 = document.getElementById("rd-paper2");
  if (paper2 && !paper2.offsetParent) paper2 = null;      /* hidden in portrait */
  /* both sheets share one height (the row stretches), so both must be measured
     or the fuller page overflows while the emptier one looks fitted */
  var lines = Array.prototype.slice.call(paper.querySelectorAll(".qline"));
  var lines2 = paper2 ? Array.prototype.slice.call(paper2.querySelectorAll(".qline")) : [];
  if (!lines.length) return;
  /* clear last run's centring first — its gaps would be measured as content
     width and the search would spiral down to the floor */
  lines.concat(lines2).forEach(function(ln){
    /* the header and the basmallah are centred by the print, not by the fit */
    if (ln.classList.contains("qhead") || ln.classList.contains("qbism")) return;
    ln.classList.remove("qcen");
  });
  paper.style.removeProperty("--tw");
  if (paper2) paper2.style.removeProperty("--tw");

  var foot = paper.querySelector(".rdfoot");
  var footH = foot ? foot.getBoundingClientRect().height : 0;
  /* the paper fills the screen from where it starts down to the tab bar;
     anything below it (translation, recording) stays scrollable extras */
  var vh = window.innerHeight || 700;
  var pt = paper.getBoundingClientRect().top;
  var card = document.querySelector(".rdcard");
  var barH = 0;
  if (card && getComputedStyle(card).position === "fixed") barH += card.getBoundingClientRect().height;
  /* the tab bar is hidden in the mushaf view — measure it instead of assuming it,
     so the height it used to take goes back to the page */
  var tabsEl = document.querySelector(".tabs");
  var tabsH = (tabsEl && getComputedStyle(tabsEl).display !== "none")
    ? tabsEl.getBoundingClientRect().height : 0;
  /* the surah/page/para row is chrome the sheet has to fit around: it has
     already moved the paper down, so fullscreen only needs its height back */
  var infoT = document.getElementById("rd-info");
  var infoTH = infoT ? infoT.getBoundingClientRect().height : 0;
  document.body.style.setProperty("--rdinfo", Math.round(infoTH) + "px");
  var chromeH = (document.body.classList.contains("focus") ? 10 : 22 + tabsH + barH);
  var avail = vh - pt - chromeH;
  if (avail < 260) avail = 260;
  var target = Math.max(160, avail - 40 - footH);
  var nast = paper.classList.contains("nast");

  function set(px){
    /* nastaliq hangs below the baseline, so it needs more leading — but when
       the font is already at the floor, tight leading is what saves the page */
    var lh = nast ? (px >= 24 ? 2.15 : px >= 19 ? 1.95 : 1.7)
                  : (px > 26 ? 1.75 : 1.9);
    paper.style.setProperty("--qf", px + "px");
    paper.style.setProperty("--ql", lh);
    if (paper2){
      paper2.style.setProperty("--qf", px + "px");
      paper2.style.setProperty("--ql", lh);
    }
  }
  function tooWide(){
    var all = lines.concat(lines2);
    for (var i = 0; i < all.length; i++)
      if (all[i].scrollWidth > all[i].clientWidth + 1) return true;
    return false;
  }
  function tooTall(){
    function sum(ls){ var s = 0; for (var i = 0; i < ls.length; i++) s += ls[i].getBoundingClientRect().height; return s; }
    return Math.max(sum(lines), sum(lines2)) > target;
  }
  /* never below reading size: if the room truly isn't there the paper scrolls,
     it does not turn into specks */
  var lo = nast ? 14 : 15, hi = nast ? 40 : 46, best = lo;
  set(lo);
  if (!tooWide() && !tooTall()){
    for (var step = 0; step < 7; step++){
      var mid = (lo + hi) / 2;
      set(mid);
      if (tooWide() || tooTall()) hi = mid; else { best = mid; lo = mid; }
    }
  }
  /* the reader's own −/+ wins over the fit; the page may then scroll */
  set(Math.round(best * 10) / 10);
  /* On a narrow phone the fit is bound by WIDTH — the glyphs cannot grow any
     further, so the text block ends high up and leaves the sheet half empty.
     A printed mushaf never does that: it spreads its lines down the whole page.
     So when the content is shorter than the room, open the leading to fill it. */
  (function(){
    var sum = 0;
    for (var i = 0; i < lines.length; i++) sum += lines[i].getBoundingClientRect().height;
    if (!sum || sum >= target) return;
    var lh = parseFloat(paper.style.getPropertyValue("--ql")) || 1.9;
    var k = Math.min(target / sum, 3.6 / lh);        /* never absurd leading */
    if (k > 1.02){
      var nl = Math.round(lh * k * 100) / 100;
      paper.style.setProperty("--ql", nl);

    }
  })();
  var view = document.getElementById("v-mushaf");
  if (view){

    for (var li = 0; li < lines.length; li++) over += lines[li].getBoundingClientRect().height;
    over = Math.max(0, Math.ceil(over - target));
    view.style.paddingBottom = "calc(" + (Math.round(barH + tabsH + 2) + over) + "px + env(safe-area-inset-bottom))";
  }

  /* a real mushaf justifies full lines only — a surah's last line is centred,
     not pulled apart, so the word gaps stay honest */
  /* When the fit is bound by height, the glyphs no longer span the sheet, and
     justification would fabricate huge word gaps. A printed mushaf never does
     that: the text block itself is narrower. So the sheet takes the width of its
     longest line, and full lines then run edge to edge at normal spacing. */
  var all = lines.concat(lines2), nat = [], widest = 0;
  all.forEach(function(ln){
    var w = 0, kids = ln.children, gaps = 0;
    for (var i = 0; i < kids.length; i++){
      var c = kids[i];
      if (c.classList && (c.classList.contains("qhm") || c.classList.contains("qrib") ||
          c.classList.contains("swband") || c.classList.contains("qnum"))) continue;

    }

  var frame = paper.getBoundingClientRect().width - lineBox;   /* paddings */
  if (widest > 0 && lineBox > 0 && widest < lineBox){
    var col = Math.ceil(widest + 24);
    paper.style.setProperty("--tw", col + "px");
    if (paper2) paper2.style.setProperty("--tw", col + "px");
    lineBox = col;
  }
  all.forEach(function(ln, i){
    if (ln.classList.contains("qhead") || ln.classList.contains("qbism")) return;
    ln.classList.toggle("qcen", lineBox > 0 && nat[i] < lineBox * 0.82);
  });
  /* drawn straight away, not on the next frame: the fit has just settled the
     layout, and a page that is not compositing (a background tab) would never
     get that frame and would sit there with no blocks at all */
  if (RD.tp === 2) rdTpBands();

}

/* A gloss is the smallest, least reliable unit of meaning: particles shift with
   context, case endings carry the sense, and idioms span several words. So the
   panel labels the gloss as approximate, shows the whole ayah with the tapped
   word marked, gives the ayah's meaning underneath, and points to the same word
   where it already sits on the device — meaning learned from usage. */
function rdSameWord(t, notVk){
  var target = mutNorm(t), out = [], seen = {};
  if (!target) return out;
  Object.keys(RD.pages).forEach(function(p){
    var pg = RD.pages[p];
    if (!pg || !pg.lines) return;
    Object.keys(pg.lines).forEach(function(ln){
      pg.lines[ln].forEach(function(w){
        if (w.end || !w.t || w.vk === notVk) return;
        if (mutNorm(w.t) !== target || seen[w.vk]) return;
        seen[w.vk] = true; out.push({ vk:w.vk, page:+p });
      });
    });
  });
  return out.slice(0, 8);
}
function rdMeanPanel(pg, el){

          '">✕</button><i class="gr"></i>' +
          '<button class="wmsnd" aria-pressed="' + (wordSound() ? "true" : "false") +
          '" aria-label="' + uit("sound") + '">' + (wordSound() ? RIC.sound : RIC.mute) + '</button>' +
          '<button class="wmbig" aria-label="' + uit("resize") + '">⤢</button></div>';
  /* the ayah word by word — each meaning directly under its own word */
  var gws = ws.filter(function(w){ return !w.end && (w.m || w.g); });
  if (gws.length){
    h += '<div class="wmgrid' + (gws.length <= 5 ? " few" : "") + '">' + gws.map(function(w){
      return '<span class="wmcell"' + (w.t === el.dataset.t ? ' data-on="1"' : '') + '>' +
        '<span class="wmca" style="font-family:\'' + fam + '\'">' + w.g + '</span>' +
        '<span class="wmcb">' + esc(w.m || "—") + '</span></span>';

}

  px = Math.round(Math.max(min, Math.min(max, px)));

function wmDragWire(){

/* Downloads any page range for any mushaf edition without disturbing the open
   page: the URLs are built here and put straight into the cache. */
async function dlRange(p0, p1, mushafId, withAudio){
  if (RD.busy) return;
  RD.busy = true; RD.dlStop = false;
  var def = null;
  MUSHAFS.forEach(function(mu){ if (mu.id === mushafId) def = mu; });
  var v = (def && def.qcf) || (def && def.nast ? "nast" : "v2");
  if (!def){ RD.busy = false; return; }
  var total = p1 - p0 + 1, done = 0;
  try {
    for (var p = p0; p <= p1; p++){
      if (RD.dlStop){ dlProg(L.dlg.stopped); return; }
      try {
        if (v === "nast"){ if (p === p0) await rdFetch(NAST_URL); }
        else await rdFetch(QCF_BASE + v + "/woff2/p" + p + ".woff2");
      } catch(e){}
      try {
        var j = await rdFetch(rdPageUrl(p, def), "json");
        if (withAudio && j && j.verses){
          for (var i = 0; i < j.verses.length; i++){
            if (RD.dlStop){ dlProg(L.dlg.stopped); return; }
            /* try every host that allows a real download, not just the first —
               one blocked host used to make the whole audio download a no-op */
            var cs = audioSrcs(j.verses[i].verse_key);
            for (var k2 = 0; k2 < cs.length; k2++){
              try { await rdFetch(cs[k2].u); break; } catch(e){}
            }
          }
        }
      } catch(e){}
      done++;
      dlProg(fmt(L.dlg.ing, n(Math.round(done / total * 100)), n(done), n(total)));
    }
    dlProg(L.dlg.done);
    rdWarmAudio(RD.pages[RD.page]);
  } finally { RD.busy = false; RD.dlStop = false; }
}
async function rdDownloadJuz(){
  if (RD.busy) return;
  RD.busy = true;
  var prog = document.getElementById("rd-prog");
  var j = juzOf(RD.page), r = juzRange(j), total = (r[1] - r[0] + 1), done = 0;
  try {
    for (var p = r[0]; p <= r[1]; p++){
      try { await rdLoadFont(p); var pg = await rdLoadPage(p);
        for (var i = 0; i < pg.keys.length; i++){
          try { await rdFetch(AUDIO_BASE + S.settings.reciter + "/" + ayahFile(pg.keys[i])); } catch(e){}
        }
      } catch(e){}
      done++;
      var p2 = document.getElementById("rd-prog2");
      var txt = fmt(L.rd.dling, n(Math.round(done / total * 100)));
      if (prog) prog.textContent = txt;
      if (p2) p2.textContent = txt;
    }

    var pd = document.getElementById("rd-prog2"); if (pd) pd.textContent = L.rd.dlDone;
  } finally { RD.busy = false; }

/* ---------- look-alike ayahs (mutashabihat) ----------
   Adults confuse near-identical passages more than they forget them. Every
   page already on the device is scanned for runs of four or more identical
   words shared with the open page; nothing is fetched over the network. */
function mutNorm(t){
  return String(t || "")
    .replace(/[\u064B-\u0652\u0670\u06D6-\u06ED\u0640]/g, "")
    .replace(/[\u0622\u0623\u0625\u0671]/g, "\u0627")
    .replace(/\u0629/g, "\u0647")
    .replace(/\u0649/g, "\u064A")
    .trim();
}
function mutSeq(pg){
  var out = [];
  for (var ln = 1; ln <= LINES_PER_PAGE; ln++){
    (pg.lines[ln] || []).forEach(function(w){
      if (!w.end && w.t) out.push({ n:mutNorm(w.t), vk:w.vk, ln:ln });
    });
  }
  return out;
}
async function mutCachedPage(p){
  if (RD.pages[p] && RD.pages[p].v === qcfVer()) return RD.pages[p];
  var v = qcfVer();
  var url = "https://api.quran.com/api/v4/verses/by_page/" + p +
            "?words=true&per_page=all&mushaf=" + (v === "v1" ? 1 : 2) +
            "&word_fields=code_" + v + ",line_number,char_type_name,text_uthmani&language=" +
            (L.code === "zh" ? "zh" : L.code === "ur" ? "ur" : L.code === "en" ? "en" : "bn");
  var c = await rdCache(), hit = c ? await c.match(url) : null;
  if (!hit) return null;                     /* not on the device · skip it */
  var j = await hit.json(), lines = {}, keys = [];
  (j.verses || []).forEach(function(vv){
    keys.push(vv.verse_key);
    (vv.words || []).forEach(function(w){
      var ln = w.line_number || 1;
      (lines[ln] = lines[ln] || []).push({
        g:(v === "v1" ? w.code_v1 : w.code_v2), vk:vv.verse_key,
        end:w.char_type_name === "end", t:w.text_uthmani || "",
        m:(w.translation && w.translation.text) || ""
      });
    });
  });
  return { lines:lines, keys:keys, v:v };
}
async function mutScan(){
  var box = document.getElementById("rd-mut"), pg = RD.pages[RD.page];
  if (!box || !pg) return;
  box.innerHTML = '<h4>' + L.mut.h + '</h4><p>' + L.mut.busy + '</p>';
  var mine = mutSeq(pg), N = 4, index = {}, i;
  for (i = 0; i + N <= mine.length; i++){
    index[mine.slice(i, i + N).map(function(w){ return w.n; }).join(" ")] = mine[i];
  }
  var pages = memorizedPages().filter(function(p){ return p !== RD.page; }), hits = [], seen = {};
  for (var k = 0; k < pages.length && hits.length < 12; k++){
    var other = await mutCachedPage(pages[k]);
    if (!other) continue;
    var seq = mutSeq(other);
    for (i = 0; i + N <= seq.length; i++){
      var gram = seq.slice(i, i + N).map(function(w){ return w.n; }).join(" ");
      var here = index[gram];
      if (!here || seen[gram]) continue;
      seen[gram] = true;
      hits.push({ page:pages[k], vk:seq[i].vk, mineVk:here.vk,
                  txt:seq.slice(i, i + N).map(function(w){ return w.n; }).join(" ") });
      if (hits.length >= 12) break;
    }
  }
  if (!hits.length){
    box.innerHTML = '<h4>' + L.mut.h + '</h4><p>' + L.mut.none + '</p><p class="hint">' + L.mut.only + '</p>';
    return;
  }
  var words = {};
  hits.forEach(function(x){ x.txt.split(" ").forEach(function(w){ words[w] = true; }); });
  qa("#rd-paper .w").forEach(function(el){
    if (words[mutNorm(el.dataset.t || "")]) el.classList.add("mut");
  });
  box.innerHTML = '<h4>' + L.mut.h + '</h4><p class="hint" style="margin-bottom:6px">' + L.mut.hint + '</p>' +
    hits.map(function(x){
      return '<div class="mutrow"><span class="mutar">' + esc(x.txt) + '</span>' +
        '<button class="qp" data-mut="' + x.page + '">' + fmt(L.mut.at, n(x.page), ayLabel(x.vk)) + '</button>' +
        '<span class="lb" style="font-size:12px;color:var(--muted)">' + ayLabel(x.mineVk) + '</span></div>';
    }).join("");
  qa("#rd-mut [data-mut]").forEach(function(b){
    b.onclick = function(){ rdStop(); RD.page = +b.dataset.mut; RD.sel = null; renderMushaf(); };
  });
}

/* ---------- revision engine ----------
   Each memorized page carries a strength and a due date. A clean recall pushes
   the page further away (spacing · Ebbinghaus 1885, Cepeda 2006); a shaky one
   brings it back tomorrow. The gate and the retrieval test feed the same
   number, so the queue follows real recall instead of a fixed calendar. */
function revOf(p){
  if (!S.rev) S.rev = {};
  if (!S.rev[p]) S.rev[p] = { str:0.5, ivl:1, due:TODAY, reps:0, lapses:0, last:TODAY };
  return S.rev[p];
}
function revRecord(p, q){
  var r = revOf(p);
  r.reps++;
  if (q >= 0.8){
    r.str = Math.min(1, r.str + 0.12);
    r.ivl = Math.max(1, Math.round(r.ivl * (1.6 + r.str)));
  } else if (q >= 0.5){
    r.str = Math.max(0.15, r.str - 0.05);
    r.ivl = Math.max(1, Math.round(r.ivl * 0.8));
  } else {
    r.str = Math.max(0.1, r.str - 0.25);
    r.ivl = 1; r.lapses++;
  }
  r.ivl = Math.min(120, r.ivl);
  r.last = TODAY;
  r.due = key(addDays(new Date(), r.ivl));
  if (r.str < 0.4) S.weak[p] = true;
  else if (r.str > 0.75) delete S.weak[p];
  save();
}
function revDue(){
  if (!S.rev) return [];
  var m = {}; memorizedPages().forEach(function(p){ m[p] = true; });
  var due = Object.keys(S.rev).map(Number)
    .filter(function(p){ return m[p] && S.rev[p].due <= TODAY; })
    .sort(function(a, b){ return S.rev[a].str - S.rev[b].str; });
  /* Pages earned here all come back on the day they fall due. The pile carried in
     from before is the one that needs a ceiling — ten juz is two hundred pages,
     and the setting says how many of those may return in a day. */
  var k = knownMap(), cap = (S.settings.oldPerDay === 0 || S.settings.oldPerDay) ? +S.settings.oldPerDay : 2;
  var out = [], old = 0;
  due.forEach(function(p){
    if (k[p]){ if (old >= cap) return; old++; }
    out.push(p);
  });
  return out;
}

  var box = document.getElementById("exam");
  if (!built){
    box.classList.add("on");
    document.getElementById("exam-in").innerHTML =
      '<h3>' + L.ex.title + '</h3><p class="intro">' + L.ex.need + '</p>' +
      '<div class="exfoot"><button class="abtn" data-ex="close">' + L.ex.close + '</button></div>';
    exWire();
    return;
  }
  EX = built;
  box.classList.add("on");
  exRender();
}
function exRender(msg, cls){
  var E = L.ex, it = EX.items[EX.i], fam = RD.fonts[RD.page] || "";
  var h = '<div class="exhead"><div><div class="kicker">' + E.title + '</div>' +
          '<h3>' + E[EX.mode === "order" ? "order" : EX.mode === "cloze" ? "cloze" : "next"] + '</h3></div>' +
          '<span class="rdprog">' + fmt(E.q, n(EX.i + 1), n(EX.items.length)) + '</span></div>';
  h += '<div class="exmodes">' + ["order","cloze","next"].map(function(m){
        return '<button class="rdtog" data-exmode="' + m + '" aria-pressed="' + (EX.mode === m) + '"><i></i>' + E[m] + '</button>';
      }).join("") + '</div>';
  if (EX.done){
    h += '<p class="intro" style="margin-top:14px">' + E.done + ' · ' + fmt(E.score, n(EX.right), n(EX.wrong)) + '</p>';
    if (EX.wrong > EX.right) h += '<p class="exmsg no">' + E.weakAdd + '</p>';
    h += '<div class="exfoot"><button class="abtn go" data-ex="again">' + E.again + '</button>' +
         '<button class="abtn" data-ex="close">' + E.close + '</button></div>';
  } else if (it.kind === "order"){
    h += '<p class="intro">' + E.orderHint + '</p>' +
         '<div class="exq" style="font-family:\'' + fam + '\'">' +
           (EX.picked.length ? EX.picked.join(" ") : "&nbsp;") + '</div>' +
         '<div class="exchips" style="font-family:\'' + fam + '\'">' +
         it.pool.map(function(c, i){
           return '<button class="exchip' + (EX.picked.indexOf(c) > -1 ? " used" : "") +
                  '" data-exchip="' + i + '">' + c + '</button>';
         }).join("") + '</div>';
  } else {
    h += '<p class="intro">' + (it.kind === "cloze" ? E.clozeHint : E.nextHint) + '</p>' +
         '<div class="exq" style="font-family:\'' + fam + '\'">' +
           (it.kind === "cloze" ? it.text : it.text + ' <span class="gap"></span>') + '</div>' +
         '<div class="exchips" style="font-family:\'' + fam + '\'">' +
         it.opts.map(function(o, i){ return '<button class="exchip" data-exopt="' + i + '">' + o + '</button>'; }).join("") +
         '</div>';
  }
  if (!EX.done) h += '<p class="exmsg ' + (cls || "") + '">' + (msg || "") + '</p>' +
                     '<div class="exfoot"><button class="abtn" data-ex="close">' + E.close + '</button></div>';
  document.getElementById("exam-in").innerHTML = h;
  exWire();
}
function exFinish(){
  EX.done = true;
  var d = day(TODAY);
  d.errors = (d.errors || 0) + EX.wrong;
  revRecord(RD.page, EX.right + EX.wrong ? EX.right / (EX.right + EX.wrong) : 0);
  save(); renderToday(); renderProgress();
  exRender();
}
function exNext(){
  if (EX.i + 1 >= EX.items.length) return exFinish();
  EX.i++; EX.picked = [];
  exRender();
}
function exWire(){
  qa("[data-ex]").forEach(function(b){
    b.onclick = function(){
      if (b.dataset.ex === "close"){ document.getElementById("exam").classList.remove("on"); }
      else exOpen(EX ? EX.mode : "order");
    };
  });
  qa("[data-exmode]").forEach(function(b){ b.onclick = function(){ exOpen(b.dataset.exmode); }; });
  qa("[data-exchip]").forEach(function(b){
    b.onclick = function(){
      var it = EX.items[EX.i], c = it.pool[+b.dataset.exchip];
      if (c === it.right[EX.picked.length]){
        EX.picked.push(c);
        if (EX.picked.length === it.right.length){ EX.right++; rdPlay([it.vk], 1); setTimeout(exNext, 700); }
        else exRender(L.ex.right, "ok");
      } else { EX.wrong++; b.classList.add("bad"); exRender(L.ex.wrong, "no"); }
    };
  });
  qa("[data-exopt]").forEach(function(b){
    b.onclick = function(){
      var it = EX.items[EX.i];
      if (it.opts[+b.dataset.exopt] === it.ans){ EX.right++; b.classList.add("good"); rdPlay([it.vk], 1); setTimeout(exNext, 700); }
      else { EX.wrong++; b.classList.add("bad"); exRender(L.ex.wrong, "no"); }
    };
  });
}


/* ---------- PRACTICE: retrieval drills ----------
   Reading again feels like learning; only pulling it out of memory is. Every
   drill here is a retrieval attempt with delayed feedback, a criterion of three
   flawless recalls, and an interval that follows how hard the recall was —
   Karpicke & Roediger (2008), Rawson & Dunlosky (2011), Butler & Roediger (2008). */
var DR = { kind:null, queue:[], qi:0, reveal:false, t0:0, pred:null, right:0, wrong:0,
           reps:0, capOk:false, pg:null, page:0, loading:false, pick:null };
function drS(){
  if (!S.drill) S.drill = {};
  if (!S.drill.items) S.drill.items = {};
  if (!S.drill.salat) S.drill.salat = {};
  if (!S.drill.sess)  S.drill.sess  = {};
  return S.drill;
}
function drItem(k){
  var d = drS();
  if (!d.items[k]) d.items[k] = { s:0, d:5, streak:0, reps:0, err:0, due:TODAY, ms:0, last:"" };
  var it = d.items[k];
  if (it.s == null){ it.s = it.streak ? 2 : 0; it.d = 5; it.last = ""; }   /* older records */
  return it;
}
function drFirm(k){ var it = drS().items[k]; return !!it && it.streak >= 4; }
function drDue(k){ var it = drS().items[k]; return !it || it.due <= TODAY; }
function drRet(){ return +(S.settings.retention || 0.9); }
/* Interval from the retrievability curve used by FSRS: R(t) = (1 + 19/81·t/S)^-0.5,
   solved for the day R drops to the target. Stability grows with each success and
   collapses on a slip; difficulty shifts the growth rate.
   Criterion is counted ONCE A DAY — three correct recalls inside one sitting hold
   ~20% a week later, the same three spread across sessions ~69% (Vaughn, Dunlosky
   & Rawson 2016), so "firm" needs four separate days, not four taps. */
function drGrade(k, g, ms){
  var it = drItem(k);
  if (g === 2 && ms > 7000) g = 1;                 /* slow recall is not a strong one */
  it.reps++; it.ms = ms;
  it.d = Math.max(1, Math.min(10, it.d + (2 - g) * 0.7));
  var first = (it.last !== TODAY);
  if (!g){
    it.err++; it.s = Math.max(0.4, it.s * 0.4); it.streak = 0;
  } else if (first){
    it.s = it.s ? it.s * (1 + (2.6 - 0.18 * it.d) * (g === 1 ? 0.5 : g === 3 ? 1.4 : 1))
                : [0, 1.2, 3.1, 8][g];
    it.streak++;                                    /* one credit per day */
  }
  it.last = TODAY;
  /* repeating in the same sitting must not buy a longer interval — massed
     repetition is exactly what the one-a-day rule exists to remove */
  if (!g || first){
    var R = drRet(), t = (it.s * 81 / 19) * (Math.pow(R, -2) - 1);
    it.due = key(addDays(parseKey(TODAY), g ? Math.max(1, Math.round(t)) : 1));
  }
  drS().sess[TODAY] = (drS().sess[TODAY] || 0) + 1;
  save();
}
function drPage(){
  var d = day(TODAY);
  return (d.sabaq.pages && d.sabaq.pages[0]) || S.settings.lastPage || S.settings.startPage || 1;
}
function drKeys(){
  var pg = DR.pg; if (!pg) return [];
  var d = day(TODAY);
  if (d.sabaq.from){
    var s = rdSelFromLines(pg, d.sabaq.from, d.sabaq.to || d.sabaq.from);
    return pg.keys.slice(s.a, s.b + 1);
  }
  return pg.keys.slice(0, 6);
}
async function drEnsure(){
  if (DR.loading || DR.tried) return;
  DR.loading = true; DR.tried = true;
  var p = drPage();
  try { await rdLoadFont(p); DR.pg = await rdLoadPage(p); DR.page = p; }
  catch(e){ DR.pg = null; }
  DR.loading = false;
  renderDrill();
}
/* four-word runs that appear in two different ayahs among the pages on the device */
function drMutPairs(){
  var seq = {}, out = [];
  Object.keys(RD.pages).forEach(function(p){
    var pg = RD.pages[p];
    if (!pg || !pg.lines || !RD.fonts[+p]) return;
    var ws = [];
    for (var ln = 1; ln <= LINES_PER_PAGE; ln++)
      (pg.lines[ln] || []).forEach(function(w){ if (!w.end && w.t) ws.push(w); });
    for (var i = 0; i + 3 < ws.length; i++){
      var run = ws.slice(i, i + 4);
      var kk = run.map(function(w){ return mutNorm(w.t); }).join(" ");
      var e = { vk:run[0].vk, page:+p, g:run.map(function(w){ return w.g; }).join("") };
      if (!seq[kk]) seq[kk] = [e];
      else if (seq[kk].length < 2 && seq[kk][0].vk !== e.vk) seq[kk].push(e);
    }
  });
  Object.keys(seq).forEach(function(kk){ if (seq[kk].length > 1) out.push(seq[kk]); });
  return exShuffle(out).slice(0, 10);
}
function drBuild(kind){
  var q = [], keys = drKeys();
  if (kind === "line" || kind === "fade")
    q = keys.filter(drDue).map(function(k){ return { t:kind, vk:k }; });
  else if (kind === "join")
    for (var i = 0; i + 1 < keys.length; i++) q.push({ t:"join", vk:keys[i], vk2:keys[i+1] });
  else if (kind === "night"){
    var its = drS().items;
    q = Object.keys(its).sort(function(a, b){ return its[a].ease - its[b].ease; })
        .filter(function(k){ return keys.indexOf(k) >= 0 || DR.pg && rdKeyIdx(DR.pg, k) >= 0; })
        .slice(0, 3).map(function(k){ return { t:"line", vk:k }; });
    if (!q.length) q = keys.slice(0, 3).map(function(k){ return { t:"line", vk:k }; });
  }
  else if (kind === "mut")
    q = drMutPairs().map(function(pair){ return { t:"mut", pair:pair, i:Math.random() < .5 ? 0 : 1 }; });
  else if (kind === "mix")
    q = exShuffle(drBuild("line").concat(drBuild("join"), drBuild("mut").slice(0, 3)));
  return q;
}
function drStart(kind){
  DR.tried = false;
  var q = drBuild(kind);
  if (!q.length){                       /* nothing to ask — never invent a score */
    DR.msg = (kind === "mut") ? L.dr.empty : L.dr.none;
    DR.kind = null; DR.pred = null; renderDrill(); return;
  }
  DR.kind = kind; DR.queue = q; DR.qi = 0; DR.reveal = false;
  DR.right = 0; DR.wrong = 0; DR.reps = 0; DR.capOk = false; DR.pred = null; DR.pick = null;
  renderDrill();
}
function drJudge(g){
  var it = DR.queue[DR.qi], ms = Date.now() - DR.t0;
  var k = it && (it.vk || (it.pair && it.pair[it.i].vk));
  if (k) drGrade(k, g, ms);
  if (g) DR.right++; else DR.wrong++;
  DR.reps++; DR.qi++; DR.reveal = false; DR.pick = null;
  renderDrill();
}
function drWords(vk){ return DR.pg ? exWordsOf(DR.pg, vk) : []; }
function drSpans(ws, shown){
  return ws.map(function(w, i){
    return '<span' + (i < shown ? '' : ' class="dim"') + '>' + w.g + '</span>';
  }).join("");
}
function renderDrill(){
  var D = L.dr, el = document.getElementById("v-drill");
  if (!el || !D) return;
  if (!DR.pg && !DR.loading && !DR.tried){ el.innerHTML = '<div class="kicker">' + D.k + '</div><h2>' + D.h + '</h2><p class="empty">' + L.rd.loading + '</p>'; drEnsure(); return; }
  if (!DR.pg){ el.innerHTML = '<div class="kicker">' + D.k + '</div><h2>' + D.h + '</h2><p class="empty">' + D.empty + '</p>'; return; }
  var fam = RD.fonts[DR.page] || "";
  if (!DR.kind) return drHome(el, D);
  if (DR.pred == null) return drPredict(el, D);
  if (DR.reps >= 7 && !DR.capOk && DR.qi < DR.queue.length) return drCap(el, D);
  if (DR.qi >= DR.queue.length) return drResult(el, D);

  var it = DR.queue[DR.qi], q = "", sub = "", crit = "";
  if (it.t === "mut"){
    var e = it.pair[it.i], f2 = RD.fonts[e.page] || fam;
    q = '<div class="drq" style="font-family:\'' + f2 + '\'">' + e.g + '</div>';
    sub = D.mutQ;
    var opts = exShuffle(it.pair.map(function(x){ return x.vk; }));
    q += '<div class="dropt">' + opts.map(function(vk){
      var mark = DR.pick ? (vk === e.vk ? " ✓" : (vk === DR.pick ? " ✗" : "")) : "";
      return '<button data-drop="' + vk + '">' + L.rd.ay + ' ' + ayLabel(vk) + mark + '</button>';
    }).join("") + '</div>';
  } else if (it.t === "join"){
    var a = drWords(it.vk), b = drWords(it.vk2);
    q = '<div class="drq" style="font-family:\'' + fam + '\'">' +
        a.slice(-2).map(function(w){ return '<span>' + w.g + '</span>'; }).join("") +
        (DR.reveal ? b.slice(0, 3).map(function(w){ return '<span>' + w.g + '</span>'; }).join("") : '<span class="dim">؟</span>') +
        '</div>';
    sub = D.joinQ + ' · ' + L.rd.ay + ' ' + ayLabel(it.vk) + ' → ' + ayLabel(it.vk2);
  } else {
    var ws = drWords(it.vk), st = drItem(it.vk).streak;
    var shown = DR.reveal ? ws.length : Math.max(0, 2 - Math.min(2, st));
    q = '<div class="drq" style="font-family:\'' + fam + '\'">' + drSpans(ws, shown) + '</div>';
    sub = fmt(D.cue, shown >= 2 ? D.cue0 : shown === 1 ? D.cue1 : D.cue2) + ' · ' + L.rd.ay + ' ' + ayLabel(it.vk);
    crit = '<span class="drcrit" title="' + fmt(D.sess, n(st)) + '">' +
           [0,1,2,3].map(function(i){ return '<i class="' + (i < st ? "on" : "") + '"></i>'; }).join("") + '</span>';
  }

  el.innerHTML = '<div class="kicker">' + D.k + '</div><h2>' + D[DR.kind === "night" ? "night" : DR.kind] + '</h2>' +
    '<div class="drhead"><span class="drbadge">' + fmt(D.of, n(DR.qi + 1), n(DR.queue.length)) + '</span>' +
      crit + '<button class="rdmini" id="dr-end"><b>' + D.end + '</b></button></div>' +
    q +
    '<p class="drbadge" style="margin-top:10px">' + sub + '</p>' +
    '<div class="drrow" style="margin-top:14px">' +
      (it.t === "mut"
        ? (DR.pick ? '<button class="abtn go" id="dr-next">' + L.rd.next + '</button>' : '')
        : (DR.reveal
            ? '<button class="abtn" data-drg="0">' + D.g0 + '</button>' +
              '<button class="abtn" data-drg="1">' + D.g1 + '</button>' +
              '<button class="abtn go" data-drg="2">' + D.g2 + '</button>' +
              '<button class="abtn" data-drg="3">' + D.g3 + '</button>'
            : '<button class="abtn go" id="dr-reveal">' + D.reveal + '</button>')) +
    '</div>';
  DR.t0 = DR.t0 || Date.now();
  var g = function(id){ return document.getElementById(id); };
  if (g("dr-end")) g("dr-end").onclick = function(){ DR.kind = null; DR.pred = null; renderDrill(); };
  if (g("dr-reveal")) g("dr-reveal").onclick = function(){ DR.reveal = true; renderDrill(); };
  qa("#v-drill [data-drg]").forEach(function(b){
    b.onclick = function(){ drJudge(+b.dataset.drg); DR.t0 = 0; };
  });
  if (g("dr-next")) g("dr-next").onclick = function(){
    var ok = DR.pick === it.pair[it.i].vk; DR.pick = null; drJudge(ok ? 2 : 0); DR.t0 = 0;
  };
  qa("#v-drill [data-drop]").forEach(function(b){
    b.onclick = function(){ if (!DR.pick){ DR.pick = b.dataset.drop; renderDrill(); } };
  });
}
function drPredict(el, D){
  el.innerHTML = '<div class="kicker">' + D.k + '</div><h2>' + D[DR.kind === "night" ? "night" : DR.kind] + '</h2>' +
    '<div class="drcard"><h4>' + D.pred + '</h4>' +
    '<input class="drrange" type="range" id="dr-pred" min="0" max="100" step="10" value="70">' +
    '<p class="drbadge" id="dr-predv">' + n(70) + '%</p>' +
    '<div class="drrow"><button class="abtn go" id="dr-predgo">' + D.predGo + '</button>' +
    '<button class="abtn" id="dr-predback">' + D.end + '</button></div></div>';
  var r = document.getElementById("dr-pred"), v = document.getElementById("dr-predv");
  r.oninput = function(){ v.textContent = n(+r.value) + "%"; };
  document.getElementById("dr-predgo").onclick = function(){ DR.pred = +r.value; DR.t0 = 0; renderDrill(); };
  document.getElementById("dr-predback").onclick = function(){ DR.kind = null; renderDrill(); };
}
function drCap(el, D){
  el.innerHTML = '<div class="kicker">' + D.k + '</div><h2>' + D.h + '</h2>' +
    '<div class="drwarn">' + D.cap + '</div>' +
    '<div class="drrow"><button class="abtn go" id="dr-stop">' + D.end + '</button>' +
    '<button class="abtn" id="dr-go">' + D.capGo + '</button></div>';
  document.getElementById("dr-stop").onclick = function(){ DR.qi = DR.queue.length; renderDrill(); };
  document.getElementById("dr-go").onclick = function(){ DR.capOk = true; renderDrill(); };
}
function drResult(el, D){
  var tot = DR.right + DR.wrong, real = tot ? Math.round(DR.right / tot * 100) : 0;
  el.innerHTML = '<div class="kicker">' + D.k + '</div><h2>' + D.res + '</h2>' +
    '<div class="drcard"><p class="drres">' + fmt(D.resPred, n(DR.pred || 0)) + '<br>' +
    fmt(D.resReal, n(real)) + '</p><p>' + D.resNote + '</p>' +
    '<div class="drrow"><button class="abtn go" id="dr-again">' + D.again + '</button>' +
    '<button class="abtn" id="dr-home">' + D.end + '</button></div></div>';
  document.getElementById("dr-again").onclick = function(){ drStart(DR.kind); };
  document.getElementById("dr-home").onclick = function(){ DR.kind = null; DR.pred = null; renderDrill(); };
}
function drHome(el, D){
  var keys = drKeys(), due = keys.filter(drDue).length;
  var hr = new Date().getHours(), sl = drS().salat[TODAY] || 0;
  var card = function(k, title, hint, extra){
    return '<div class="drcard"><h4>' + title + '</h4><p>' + hint + '</p>' +
      (extra || '<div class="drrow"><button class="abtn go" data-drstart="' + k + '">' + D.start + '</button></div>') +
      '</div>';
  };
  var msg = DR.msg; DR.msg = null;
  var h = '<div class="kicker">' + D.k + '</div><h2>' + D.h + '</h2><p class="intro">' + D.p + '</p>' +
    (msg ? '<div class="drwarn">' + msg + '</div>' : '') +
    '<p class="drbadge">' + D.due + ' · ' + n(due) + ' · ' + fmt(L.phase.page, n(DR.page)) + '</p>' +
    '<p class="drcard" style="font-size:12.5px;line-height:1.65;opacity:.8;margin-top:12px">' + D.oneADay + '</p>' +
    '<div class="drcards">' +
      (due ? card("line", D.line, D.lineH) : '<div class="drcard"><p style="margin:0">' + D.none + '</p></div>') +
      card("join", D.join, D.joinH) +
      card("fade", D.fade, D.fadeH) +
      card("mut", D.mut, D.mutH) +
      card("mix", D.mix, D.mixH) +
      card("salat", D.salat, D.salatH,
        '<div class="drrow"><button class="abtn go" id="dr-salat">' + D.salatLog + '</button>' +
        '<span class="drbadge">' + fmt(D.salatN, n(sl)) + '</span></div>') +
      (hr >= 20 ? card("night", D.night, D.nightH) : '') +
    '</div>';
  el.innerHTML = h;
  qa("#v-drill [data-drstart]").forEach(function(b){
    b.onclick = function(){ drStart(b.dataset.drstart); };
  });
  var s = document.getElementById("dr-salat");
  if (s) s.onclick = function(){ drS().salat[TODAY] = (drS().salat[TODAY] || 0) + 1; save(); renderDrill(); };
}

function knPageOf(st, s, a){
  var best = 1;

  });
  return best;
}
function knSurahPages(sp, s){

  /* a surah that begins mid-page shares that page with the one before it: give
     the shared page to the later surah only, or marking two surahs in a row

async function diagRun(){
  var b = document.getElementById("diag-body");
  if (!b) return;
  var rows = [];
  function add(name, ok, note){
    rows.push('<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;' +
      'border-bottom:1px solid var(--rule)">' +
      '<span style="flex:0 0 18px;color:' + (ok ? "var(--verdigris)" : "var(--maroon)") + '">' +
      (ok ? "\u2713" : "\u00D7") + '</span>' +
      '<span style="flex:1"><b style="font-weight:600">' + name + '</b>' +
      (note ? '<br><span style="font-size:12.5px;color:var(--ink-3);word-break:break-all">' + esc(String(note)) + '</span>' : '') +
      '</span></div>');
  }
  var G = DGL[L.code] || DGL.en;
  b.innerHTML = '<p style="color:var(--ink-3)">' + G.run + '</p>';
  add("Build", true, APP_VER);
  add(G.origin, true, location.protocol + "//" + location.host);
  add(G.secure, !!window.isSecureContext, window.isSecureContext ? G.yes : G.noMic);
  add(G.net, !!navigator.onLine, navigator.onLine ? G.online : G.offline);
  add("MediaRecorder", !!window.MediaRecorder, window.MediaRecorder ? G.have : G.miss);
  var mdOk = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  add("mediaDevices", mdOk, mdOk ? G.have : G.mdMiss);
  b.innerHTML = rows.join("");

  /* Probe each host with an audio ELEMENT, not fetch: playback needs no CORS, so
     a fetch probe reports a working host as broken and sends us chasing ghosts. */
  function probe(url){
    return new Promise(function(res){
      var a = new Audio(), done = false, t1 = Date.now();
      var fin = function(ok, m){ if (done) return; done = true;
        try { a.pause(); a.src = ""; } catch(e){} res({ ok:ok, note:m }); };
      a.preload = "auto";
      a.oncanplay = function(){ fin(true, "OK · " + (Date.now() - t1) + "ms"); };
      a.onerror = function(){
        var c = (a.error && a.error.code) || 0;
        fin(false, (c === 4 ? G.gone : c === 2 ? G.netErr : G.err + " " + c) +
          " · " + (Date.now() - t1) + "ms");
      };
      setTimeout(function(){ fin(false, G.timeout + " · 7000ms"); }, 7000);
      a.src = url; a.load();
    });
  }
  var cands = audioSrcs("1:1").slice(0, 4);
  for (const c of cands){
    var pr = await probe(c.u);
    add(c.h, pr.ok, pr.note + " · " + c.u.replace("https://", ""));
    b.innerHTML = rows.join("");
  }
  add(G.lastHost, !!S.settings.audioHost, S.settings.audioHost || G.lastNone);
  add(G.unlock, rdOK, rdOK ? G.unlockY : G.unlockN);
  b.innerHTML = rows.join("");

  var fam = "QCF" + qcfVer() + "P" + pad3(RD.page || 1);
  var fOk = false;
  try { fOk = document.fonts.check('16px "' + fam + '"'); } catch(e){}
  add(G.font, fOk, fam + " · " + (fOk ? G.fontOk : G.fontNo));
  b.innerHTML = rows.join("");

  /* the microphone, with the real permission request */
  var micNote = "", micOk = false;
  try {
    var st = await navigator.mediaDevices.getUserMedia({ audio:true });
    micOk = true; micNote = G.micOk;
    st.getTracks().forEach(function(t){ t.stop(); });
  } catch(e){ micNote = (e && (e.name + " · " + e.message)) || String(e); }
  add(G.mic, micOk, micNote);
  b.innerHTML = rows.join("") +
    '<p style="margin-top:16px;font-size:12.5px;color:var(--ink-3)">' + G.photo + '</p>';
}

    }
  }
} catch(err){ fatal(err); } })();
</script>

<script>
/* ---- native app behaviour: back button, per-tab scroll, no page bounce ---- */
(function(){
  var main=document.querySelector('main.wrap'); if(!main) return;
  var pos={}, last=document.querySelector('.view.on');
  new MutationObserver(function(){
    var now=document.querySelector('.view.on');
    if(now&&now!==last){ if(last) pos[last.id]=main.scrollTop; last=now; main.scrollTop=pos[now.id]||0; }
    document.body.classList.toggle('mushaf', !!(now&&now.id==='v-mushaf'));
    try{ if(typeof syncDrawerNav==='function') syncDrawerNav(); }catch(e){}
    if(now&&now.id==='v-mushaf'&&typeof rdFitSoon==='function') rdFitSoon();
    try{ if(typeof fabWire==='function') fabWire(); }catch(e){}
    if(!(now&&now.id==='v-mushaf')&&typeof fabMicStop==='function'&&window.FAB&&FAB.rec) fabMicStop();
  }).observe(main,{subtree:true,attributes:true,attributeFilter:['class']});

  function back(){
    if(window.FAB&&FAB.rec){ fabMicStop(); return true; }
    if(window.FAB&&FAB.open){ FAB.open=false; fabRender(); return true; }
    /* anything layered over the page closes first, newest layer on top —
       on Android the hardware key must peel these off, never exit the app */
    var dg=document.getElementById('diag');
    if(dg&&!dg.hidden){ diagClose(); return true; }
    var ix=document.getElementById('idx');
    if(ix&&!ix.hidden){ idxClose(); return true; }
    var dw=document.getElementById('drawer');
    if(dw&&!dw.hidden){ drawerClose(); return true; }
    var ov=document.querySelector('.ovl.on,.rep.on');
    if(ov){ ov.classList.remove('on'); return true; }
    var mn=document.getElementById('rd-mean');
    if(mn&&mn.classList.contains('on')){ rdMeanClose(); return true; }
    if(document.body.classList.contains('focus')){
      var f=document.querySelector('.fexit'); if(f){f.click(); return true;}
    }
    var card=document.querySelector('.rdcard.open');
    if(card){ card.classList.remove('open'); if(typeof rdFitSoon==='function') rdFitSoon(); return true; }
    if(rdAudio){ rdStop(); return true; }
    var t=document.querySelector('#tabs [aria-selected="true"]'), all=document.querySelectorAll('#tabs .tab');
    if(t&&all.length&&t!==all[0]){ all[0].click(); return true; }
    return false;
  }
  history.pushState({h:1},'');
  addEventListener('popstate',function(){ if(back()) history.pushState({h:1},''); });
  document.addEventListener('gesturestart',function(e){e.preventDefault();});
  main.addEventListener('scroll',function(){
    document.body.classList.toggle('scrolled', main.scrollTop > 4);
  },{passive:true});
  try{ document.body.classList.toggle('mushaf', !!document.querySelector('#v-mushaf.on'));
       try{ if(typeof syncDrawerNav==='function') syncDrawerNav(); }catch(e){}
       try{ if(typeof fabWire==='function') fabWire(); }catch(e){} }catch(e){}
})();
</script>
</body>
